<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>주식 테마 대시보드</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,'Segoe UI',sans-serif;background:#f4f6fa;color:#1e293b;min-height:100vh}
/* 헤더 */
.header{background:#ffffff;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #e5e9f0;position:sticky;top:0;z-index:100}
.header h1{font-size:18px;color:#1e293b}
.header-right{display:flex;gap:8px;align-items:center}
.btn{padding:8px 14px;border-radius:8px;border:none;font-size:13px;cursor:pointer;font-weight:600;transition:all .2s}
.btn-primary{background:#2563eb;color:#fff}
.btn-primary:hover{background:#1d4ed8}
.btn-secondary{background:#eef1f6;color:#475569}
.btn-secondary:hover{background:#e2e7f0}
.btn-small{padding:5px 10px;font-size:12px}
.btn-toggle{background:#fef3c7;color:#92400e}
.btn-toggle:hover{background:#fde68a}
.st{font-size:11px;padding:4px 10px;border-radius:8px;font-weight:600}
.st.off{background:#eef1f6;color:#94a3b8}
.st.on{background:#dcfce7;color:#15803d}
.st.ld{background:#fef3c7;color:#92400e}
/* 상태 바 */
.status-bar{background:#ffffff;padding:10px 20px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #e5e9f0;flex-wrap:wrap}
.prog-area{display:none;flex:1;min-width:200px}
.prog-bar{height:4px;background:#e5e9f0;border-radius:2px;overflow:hidden}
.prog-fill{height:100%;background:#2563eb;width:0%;transition:width .3s}
.prog-text{font-size:11px;color:#94a3b8;margin-top:4px}
/* 컨테이너 */
.container{max-width:1200px;margin:0 auto;padding:16px}
/* 검색 + 필터 바 */
.search-bar{position:relative;margin-bottom:10px}
.search-bar input{width:100%;padding:12px 16px 12px 40px;border-radius:12px;border:1px solid #e5e9f0;background:#ffffff;color:#1e293b;font-size:14px;outline:none}
.search-bar input:focus{border-color:#2563eb}
.search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#94a3b8}
.filter-bar{display:flex;align-items:center;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.filter-info{font-size:12px;color:#94a3b8}
.sort-tabs{display:flex;gap:6px;background:#ffffff;padding:4px;border-radius:12px;border:1px solid #e5e9f0}
.sort-tab{padding:8px 16px;border-radius:9px;border:none;background:transparent;color:#64748b;font-size:13px;font-weight:700;cursor:pointer;transition:all .2s}
.sort-tab:hover{color:#1e293b;background:#f4f6fa}
.sort-tab.active{background:#eab308;color:#1e293b}
/* 빈 상태 */
.empty{text-align:center;padding:60px 20px;color:#94a3b8}
.empty-icon{font-size:56px;margin-bottom:16px}
.empty-text{font-size:15px;line-height:1.8}
.empty .btn{margin-top:16px}
/* 메인 화면: 테마 카드 그리드 */
.theme-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.tc{background:#ffffff;border-radius:12px;padding:16px;cursor:pointer;border:1px solid #e5e9f0;transition:all .2s;box-shadow:0 1px 2px rgba(15,23,42,.04)}
.tc:hover{border-color:#cbd5e1;transform:translateY(-2px);box-shadow:0 4px 10px rgba(15,23,42,.08)}
.tc-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.tc-name{font-size:16px;font-weight:700;color:#1e293b}
.tc-str{font-size:14px;font-weight:700}
.tc-str.up{color:#dc2626}
.tc-str.down{color:#2563eb}
.tc-str.flat{color:#94a3b8}
.tc-list{display:flex;flex-direction:column;gap:6px}
.tc-row{display:flex;align-items:center;gap:8px}
.tc-rk{width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff}
.rk1{background:#dc2626}
.rk2{background:#f97316}
.rk3{background:#eab308}
.rk4{background:#94a3b8}
.rk5{background:#cbd5e1}
.tc-sn{font-size:13px;color:#334155;flex:1}
.tc-sr{font-size:13px;font-weight:700}
.tc-sr.up{color:#dc2626}
.tc-sr.down{color:#2563eb}
.tc-sr.flat{color:#94a3b8}
.tc-tv{font-size:11px;color:#94a3b8;min-width:44px;text-align:right}
.tc-crown{margin-top:8px;padding-top:8px;border-top:1px solid #eef1f6;font-size:12px;color:#64748b}
.tc-crown .tcn{color:#b45309;font-weight:600}
.tc-crown .tcv{color:#94a3b8}
.tc-empty{color:#cbd5e1;font-size:12px;padding:8px 0}
.tc-arrow{color:#cbd5e1;font-size:18px}
/* 테마 강도 배지 */
.tc-rank{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex-shrink:0}
.tc-rank.medal1{background:#facc15;color:#1e293b}
.tc-rank.medal2{background:#cbd5e1;color:#1e293b}
.tc-rank.medal3{background:#d97706;color:#fff}
.tc-rank.plain{background:#eef1f6;color:#94a3b8}
.tc-head-left{display:flex;align-items:center;gap:8px}
.tc-stats{display:flex;gap:10px;margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid #eef1f6;font-size:12px}
.tc-stat{display:flex;flex-direction:column;gap:2px}
.tc-stat-label{color:#94a3b8;font-size:10px}
.tc-stat-value{font-weight:700}
.tc-stat-value.up{color:#dc2626}
.tc-stat-value.down{color:#2563eb}
.tc-stat-value.flat{color:#64748b}
/* 거래대금 순위 배지 */
.tv-rk{width:24px;height:18px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;background:#dbeafe;color:#2563eb;flex-shrink:0}
/* 서브 화면 */
.sub-header{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.sub-header h2{font-size:20px;font-weight:700;color:#1e293b}
.sub-back{cursor:pointer;font-size:24px;color:#94a3b8}
.sub-back:hover{color:#1e293b}
.sub-nav{display:flex;align-items:center;gap:12px;margin-left:auto}
.sub-arrow{font-size:13px;color:#2563eb;cursor:pointer;padding:4px 8px;border-radius:6px;background:#eef1f6;font-weight:600}
.sub-arrow:hover{background:#e2e7f0}
/* 서브 테이블 */
.stock-table{width:100%;border-collapse:collapse}
.stock-table th{text-align:left;padding:10px 12px;font-size:12px;color:#94a3b8;border-bottom:1px solid #e5e9f0;position:sticky;top:0;background:#f4f6fa}
.stock-table td{padding:10px 12px;font-size:13px;border-bottom:1px solid #eef1f6}
.stock-table tr:hover td{background:#f8fafc}
.sn{font-weight:600;color:#1e293b}
.sc{color:#94a3b8;font-size:11px}
.sd{color:#94a3b8;font-size:11px;margin-top:2px}
.st-tags{display:flex;gap:3px;flex-wrap:wrap;margin-top:3px}
.st-tag{font-size:10px;background:#dbeafe;color:#2563eb;padding:1px 6px;border-radius:8px}
.price{text-align:right}
.rate{text-align:right;font-weight:700}
.rate.up{color:#dc2626}
.rate.down{color:#2563eb}
.rate.flat{color:#94a3b8}
.tv{text-align:right;color:#64748b;font-size:12px}
.rk-badge{display:inline-block;width:20px;height:20px;border-radius:5px;text-align:center;line-height:20px;font-size:10px;font-weight:800;color:#fff;margin-right:6px}
/* 에러 */
.error-msg{background:#fef2f2;color:#dc2626;padding:12px 16px;border-radius:10px;font-size:13px;margin:10px 0}
/* 편집 모달 */
.modal-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(15,23,42,.5);z-index:200;align-items:center;justify-content:center}
.modal-overlay.show{display:flex}
.modal-box{background:#ffffff;border-radius:12px;padding:20px;width:90%;max-width:400px;border:1px solid #e5e9f0;position:relative;z-index:210;box-shadow:0 10px 30px rgba(15,23,42,.15)}
.modal-box h3{font-size:16px;color:#1e293b;margin-bottom:14px}
.modal-box label{display:block;font-size:12px;color:#64748b;margin-bottom:4px;margin-top:10px}
.modal-box input{width:100%;padding:8px 10px;border-radius:8px;border:1px solid #e5e9f0;background:#f8fafc;color:#1e293b;font-size:13px;outline:none}
.modal-box input:focus{border-color:#2563eb}
.modal-btns{display:flex;gap:8px;margin-top:16px;justify-content:flex-end}
.modal-toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#dcfce7;color:#15803d;padding:10px 20px;border-radius:10px;font-size:13px;font-weight:600;z-index:300;display:none;box-shadow:0 4px 12px rgba(15,23,42,.12)}
.stock-table tr.editable:hover td{cursor:pointer;background:#f4f6fa}
@media(max-width:600px){
.theme-grid{grid-template-columns:1fr}
.header h1{font-size:15px}
}
</style>
</head>
<body>
<div class="header">
<h1>📊 주식 테마 대시보드</h1>
<div class="header-right">
<span class="st off" id="stB">⏸ 대기중</span>
<button class="btn btn-primary btn-small" id="rfB" onclick="fetchAll()">🔄 시세 불러오기</button>
<button class="btn btn-secondary btn-small" onclick="importData()">📥 데이터 가져오기</button>
<button class="btn btn-secondary btn-small" onclick="location.href='themes.html'">📋 종목 관리</button>
</div>
</div>
<div class="status-bar">
<div class="prog-area" id="pgA">
<div class="prog-bar"><div class="prog-fill" id="pgF"></div></div>
<div class="prog-text" id="pgT"></div>
</div>
<div id="errA"></div>
</div>
<div class="container">
<!-- 검색 -->
<div class="search-bar">
<span class="search-icon">🔍</span>
<input type="text" id="searchInput" placeholder="종목명, 태그로 검색" oninput="renderSearch()">
</div>

<!-- 뷰 탭: 테마보기 / 거래대금 상위 / 상승률 / 하락률 -->
<div class="filter-bar">
<div class="sort-tabs">
<button class="sort-tab" id="modeThemeBtn" onclick="setViewMode('theme')">테마보기</button>
<button class="sort-tab" id="modeTvBtn" onclick="setViewMode('tv')">거래대금 상위</button>
<button class="sort-tab" id="modeUpBtn" onclick="setViewMode('rate_up')">상승률</button>
<button class="sort-tab" id="modeDownBtn" onclick="setViewMode('rate_down')">하락률</button>
</div>
<span class="filter-info" id="filterInfo"></span>
</div>

<!-- 메인 뷰 -->
<div id="mainView"></div>
<!-- 서브 뷰 -->
<div id="subView" style="display:none"></div>
</div>

<!-- 편집 모달 -->
<div class="modal-overlay" id="editModal">
<div class="modal-box">
<h3 id="editTitle">종목 수정</h3>
<label>종목명</label>
<input type="text" id="editName">
<label>종목코드 (6자리)</label>
<input type="text" id="editCode" maxlength="6">
<label>설명 (선택)</label>
<input type="text" id="editDesc">
<div class="modal-btns">
<button class="btn btn-secondary btn-small" onclick="event.stopPropagation();closeEdit()">취소</button>
<button class="btn btn-primary btn-small" onclick="event.stopPropagation();saveEdit()">저장</button>
</div>
</div>
</div>
<div class="modal-toast" id="editToast"></div>

<script>
// ─── 데이터 ───
const STORAGE_KEY = 'stock-dashboard-data';
const LIVE_KEY = 'stock-live-data'; // 시세 데이터 저장용
const TOP_FILTER_KEY = 'stock-dashboard-top-filter'; // 상승 테마만 보기 상태 저장용
let liveData = {}; // code -> {price, change, rate, up, tradingValue, ...}
let currentView = 'main'; // main | sub
let currentThemeIdx = -1;
let viewMode = 'theme'; // theme | tv | rate_up | rate_down (상단 4개 탭)
let showAllThemes = false; // 테마 "더보기" 펼침 상태
const THEME_DISPLAY_LIMIT = 8; // 기본으로 보여줄 테마 개수 (캡처처럼 핵심만)

function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch(e) {}
  return { themes: [], version: 1 };
}

function saveData(data) {
  data.lastUpdated = new Date().toISOString();
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

// 시세 데이터 저장/불러오기
function saveLiveData() {
  try {
    localStorage.setItem(LIVE_KEY, JSON.stringify({
      data: liveData,
      savedAt: new Date().toISOString()
    }));
  } catch(e) {}
}
function loadLiveData() {
  try {
    const raw = localStorage.getItem(LIVE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      liveData = parsed.data || {};
      return parsed.savedAt || null;
    }
  } catch(e) {}
  return null;
}

// 뷰 모드 저장/불러오기
function loadViewMode() {
  try {
    const raw = localStorage.getItem(TOP_FILTER_KEY);
    if (raw === 'theme' || raw === 'tv' || raw === 'rate_up' || raw === 'rate_down') return raw;
  } catch(e) {}
  return 'theme'; // 기본값
}
function saveViewMode() {
  try { localStorage.setItem(TOP_FILTER_KEY, viewMode); } catch(e) {}
}

// ─── 포맷 유틸 ───
function fPrice(v) { return v ? v.toLocaleString() + '원' : '-'; }
function fRate(v) { 
  if (v === null || v === undefined) return '-';
  const sign = v > 0 ? '+' : '';
  return sign + v.toFixed(2) + '%';
}
function fTV(v) {
  if (!v) return '-';
  if (v >= 1000000000000) return (v/1000000000000).toFixed(1) + '조';
  if (v >= 100000000) return (v/100000000).toFixed(0) + '억';
  if (v >= 10000) return (v/10000).toFixed(0) + '만';
  return v.toLocaleString();
}

const RC = ['rk1','rk2','rk3','rk4','rk5'];


// ─── 뷰 탭 (테마보기 / 거래대금 상위 / 상승률 / 하락률) ───
function renderViewTabs() {
  document.getElementById('modeThemeBtn').className = 'sort-tab' + (viewMode === 'theme' ? ' active' : '');
  document.getElementById('modeTvBtn').className = 'sort-tab' + (viewMode === 'tv' ? ' active' : '');
  document.getElementById('modeUpBtn').className = 'sort-tab' + (viewMode === 'rate_up' ? ' active' : '');
  document.getElementById('modeDownBtn').className = 'sort-tab' + (viewMode === 'rate_down' ? ' active' : '');
}

function setViewMode(mode) {
  viewMode = mode;
  showAllThemes = false;
  saveViewMode();
  if (currentView === 'main') renderMain();
}
function toggleShowAllThemes() {
  showAllThemes = !showAllThemes;
  if (currentView === 'main') renderMain();
}

// 더보기 버튼 HTML 생성 (테마별 뷰, 종목 리스트 뷰 공통)
function renderMoreButton(totalCount, limit) {
  limit = limit || THEME_DISPLAY_LIMIT;
  if (totalCount <= limit) return '';
  if (showAllThemes) {
    return `<div style="text-align:center;margin-top:16px">
      <button class="btn btn-secondary btn-small" onclick="toggleShowAllThemes()">▲ 접기 (상위 ${limit}개만 보기)</button>
    </div>`;
  }
  return `<div style="text-align:center;margin-top:16px">
    <button class="btn btn-secondary btn-small" onclick="toggleShowAllThemes()">▼ 더보기 (${totalCount - limit}개 더 있음)</button>
  </div>`;
}

const STOCK_LIST_LIMIT = 50; // 거래대금/상승률/하락률 리스트 기본 표시 개수

// 테마 상관없이 전체 종목을 중복 제거해서 모으고, 모드에 맞게 정렬
function buildStockList(mode, data) {
  const map = {};
  data.themes.forEach(theme => {
    theme.stocks.forEach(s => {
      if (!s.code) return;
      const live = liveData[s.code];
      if (!live) return;
      if (!map[s.code]) {
        map[s.code] = {
          code: s.code, name: s.name,
          price: live.price, rate: live.rate, tradingValue: live.tradingValue || 0,
          themes: []
        };
      }
      if (!map[s.code].themes.includes(theme.name)) map[s.code].themes.push(theme.name);
    });
  });

  let list = Object.values(map);
  if (mode === 'tv') {
    list = list.filter(s => s.tradingValue > 0).sort((a, b) => b.tradingValue - a.tradingValue);
  } else if (mode === 'rate_up') {
    list = list.filter(s => s.rate > 0).sort((a, b) => b.rate - a.rate);
  } else if (mode === 'rate_down') {
    list = list.filter(s => s.rate < 0).sort((a, b) => a.rate - b.rate);
  }
  return list;
}

// 거래대금 상위 / 상승률 / 하락률: 테마 카드가 아니라 종목을 한 줄씩 쭉 나열하는 표 형태
function renderStockList(mode, data) {
  const mainView = document.getElementById('mainView');
  const list = buildStockList(mode, data);
  const label = mode === 'tv' ? '거래대금' : mode === 'rate_up' ? '상승률' : '하락률';
  const icon = mode === 'tv' ? '💰' : mode === 'rate_up' ? '📈' : '📉';

  if (list.length === 0) {
    document.getElementById('filterInfo').textContent = '';
    mainView.innerHTML = `
      <div class="empty">
        <div class="empty-icon">${icon}</div>
        <div class="empty-text">
          아직 표시할 종목이 없어요.<br>
          "🔄 시세 불러오기"를 먼저 눌러주세요.
        </div>
        <button class="btn btn-primary" onclick="fetchAll()" style="margin-top:16px">🔄 시세 불러오기</button>
      </div>`;
    return;
  }

  const limited = showAllThemes ? list : list.slice(0, STOCK_LIST_LIMIT);
  document.getElementById('filterInfo').textContent =
    `${label} 상위 ${list.length}종목 중 ${limited.length}개 표시`;

  let html = `<div style="overflow-x:auto"><table class="stock-table"><thead><tr>
    <th style="width:34px">#</th><th>종목</th><th class="price">현재가</th><th class="rate">등락률</th><th class="tv">거래대금</th>
  </tr></thead><tbody>`;
  limited.forEach((s, i) => {
    const rateClass = s.rate > 0 ? 'up' : s.rate < 0 ? 'down' : 'flat';
    const rateText = s.rate > 0 ? '+' + s.rate.toFixed(2) + '%' : s.rate.toFixed(2) + '%';
    const rankBg = i < 5 ? RC[i] : '';
    html += `<tr>
      <td>${i < 5 ? `<span class="rk-badge ${rankBg}">${i+1}</span>` : `<span style="color:#475569">${i+1}</span>`}</td>
      <td>
        <div class="sn">${s.name} <span class="sc">${s.code}</span></div>
        <div class="st-tags">${s.themes.slice(0, 5).map(t => `<span class="st-tag">#${t}</span>`).join('')}${s.themes.length > 5 ? `<span class="st-tag">+${s.themes.length - 5}</span>` : ''}</div>
      </td>
      <td class="price">${fPrice(s.price)}</td>
      <td class="rate ${rateClass}">${rateText}</td>
      <td class="tv">${fTV(s.tradingValue)}</td>
    </tr>`;
  });
  html += '</tbody></table></div>';
  html += renderMoreButton(list.length, STOCK_LIST_LIMIT);
  mainView.innerHTML = html;
}

// ─── 메인 렌더 ───
function renderMain() {
  const data = loadData();
  const mainView = document.getElementById('mainView');
  const subView = document.getElementById('subView');
  mainView.style.display = 'block';
  subView.style.display = 'none';
  currentView = 'main';

  renderViewTabs();

  if (data.themes.length === 0) {
    document.getElementById('filterInfo').textContent = '';
    mainView.innerHTML = `
      <div class="empty">
        <div class="empty-icon">📁</div>
        <div class="empty-text">
          아직 등록된 테마가 없어요!<br>
          "종목 관리" 페이지에서 테마와 종목을 추가하면<br>
          여기에 대시보드가 나타납니다.
        </div>
        <button class="btn btn-primary" onclick="location.href='themes.html'" style="margin-top:16px">📋 종목 관리로 이동</button>
      </div>`;
    return;
  }

  // 거래대금 상위 / 상승률 / 하락률 탭이면 종목 리스트로 렌더
  if (viewMode !== 'theme') {
    renderStockList(viewMode, data);
    return;
  }

  // 테마별 데이터 계산 (실시간 데이터 결합)
  const themeCards = data.themes.map((theme, ti) => {
    const stocks = theme.stocks.map(s => {
      const live = s.code ? liveData[s.code] : null;
      return {
        ...s,
        price: live ? live.price : 0,
        change: live ? live.change : 0,
        rate: live ? live.rate : 0,
        up: live ? live.up : null,
        tradingValue: live ? live.tradingValue : 0,
        high: live ? live.high : 0,
        low: live ? live.low : 0
      };
    });

    // 상승 종목 TOP5 (등락률 높은 순)
    const top5 = stocks
      .filter(s => s.rate > 0)
      .sort((a, b) => b.rate - a.rate)
      .slice(0, 5);

    // 거래대금 대장주
    const tvKing = stocks.filter(s => s.tradingValue > 0)
      .sort((a, b) => b.tradingValue - a.tradingValue)[0] || null;

    // 평균 등락률 (테마 강도)
    const ratesWithData = stocks.filter(s => s.rate !== 0);
    const avgRate = ratesWithData.length > 0
      ? ratesWithData.reduce((s, st) => s + st.rate, 0) / ratesWithData.length
      : 0;

    // 1위 종목 상승률 (테마 정렬 기준)
    const topRate = top5.length > 0 ? top5[0].rate : -Infinity;

    // 상승 종목 수 / 시세 확인된 종목 수
    const riseCount = stocks.filter(s => s.rate > 0).length;
    const dataCount = ratesWithData.length;
    const riseRatio = dataCount > 0 ? riseCount / dataCount : 0;

    // 테마 전체 거래대금 합계 (돈이 얼마나 몰렸는지)
    const totalTV = stocks.reduce((sum, s) => sum + (s.tradingValue || 0), 0);

    // 참여 점수 = 상승 종목 수 × 상승 비율
    // (종목 2~3개짜리 소형 테마가 등락률만 높게 튀는 것보다,
    //  많은 종목이 함께 동반 상승하는 "진짜 테마"를 우선하기 위한 지표)
    const participationScore = riseCount * riseRatio;

    return { theme, ti, stocks, top5, tvKing, avgRate, topRate, riseCount, dataCount, riseRatio, totalTV, participationScore };
  });

  // 참여 점수(상승종목수 × 상승비율) 순 정렬 — 모든 테마를 다 보여줌 (상승/하락 무관)
  themeCards.sort((a, b) => {
    if (b.participationScore !== a.participationScore) {
      return b.participationScore - a.participationScore;
    }
    return b.topRate - a.topRate;
  });

  const totalCount = themeCards.length;
  const displayCards = themeCards;
  const limitedCards = showAllThemes ? displayCards : displayCards.slice(0, THEME_DISPLAY_LIMIT);

  document.getElementById('filterInfo').textContent =
    `전체 테마 ${totalCount}개 중 ${limitedCards.length}개 표시`;

  if (displayCards.length === 0) {
    mainView.innerHTML = `
      <div class="empty">
        <div class="empty-icon">😴</div>
        <div class="empty-text">
          지금은 상승 중인 테마가 없어요.<br>
          시세를 다시 불러오거나, "전체 테마 보기"를 눌러보세요.
        </div>
      </div>`;
    return;
  }

  let html = '<div class="theme-grid">';
  limitedCards.forEach(({ theme, ti, top5, tvKing, avgRate, riseCount, dataCount, totalTV }, idx) => {
    const rank = idx + 1;
    const medalClass = rank === 1 ? 'medal1' : rank === 2 ? 'medal2' : rank === 3 ? 'medal3' : 'plain';
    const medalLabel = rank === 1 ? '🥇' : rank === 2 ? '🥈' : rank === 3 ? '🥉' : rank;

    // 카드 강도에 따른 은은한 배경 틴트 (평균 등락률 기준)
    const intensity = Math.min(Math.abs(avgRate) / 5, 1); // 5% 이상이면 최대 강도
    let tint = 'transparent';
    if (avgRate > 0.05) tint = `rgba(239,68,68,${(0.04 + intensity * 0.12).toFixed(2)})`;
    else if (avgRate < -0.05) tint = `rgba(59,130,246,${(0.04 + intensity * 0.12).toFixed(2)})`;

    const rateClass = avgRate > 0.05 ? 'up' : avgRate < -0.05 ? 'down' : 'flat';
    const riseRatioText = dataCount > 0 ? `${riseCount}/${dataCount}` : '-';

    html += `<div class="tc" style="background-image:linear-gradient(${tint},${tint}),linear-gradient(#ffffff,#ffffff)" onclick="openSub(${ti})">
      <div class="tc-head">
        <div class="tc-head-left">
          <span class="tc-rank ${medalClass}">${medalLabel}</span>
          <span class="tc-name">${theme.name}</span>
        </div>
      </div>
      <div class="tc-stats">
        <div class="tc-stat">
          <span class="tc-stat-label">평균 등락률</span>
          <span class="tc-stat-value ${rateClass}">${fRate(avgRate)}</span>
        </div>
        <div class="tc-stat">
          <span class="tc-stat-label">상승 종목</span>
          <span class="tc-stat-value ${rateClass}">${riseRatioText}</span>
        </div>
        <div class="tc-stat">
          <span class="tc-stat-label">총 거래대금</span>
          <span class="tc-stat-value">${totalTV ? fTV(totalTV) : '-'}</span>
        </div>
      </div>
      <div class="tc-list">`;
    if (top5.length > 0) {
      top5.forEach((s, j) => {
        const pickRateClass = s.rate > 0 ? 'up' : s.rate < 0 ? 'down' : 'flat';
        const pickRateText = s.rate > 0 ? '+' + s.rate.toFixed(2) + '%' : s.rate.toFixed(2) + '%';
        html += `<div class="tc-row">
          <div class="tc-rk ${RC[j]}">${j+1}</div>
          <span class="tc-sn">${s.name}</span>
          <span class="tc-sr ${pickRateClass}">${pickRateText}</span>
          <span class="tc-tv">${s.price ? fTV(s.tradingValue) : '-'}</span>
        </div>`;
      });
    } else {
      html += `<div class="tc-empty">시세를 불러오면 상승 TOP5가 표시됩니다</div>`;
    }
    if (tvKing) {
      html += `<div class="tc-crown">👑 거래대금 <span class="tcn">${tvKing.name}</span> <span class="tcv">${fTV(tvKing.tradingValue)}</span></div>`;
    }
    html += `</div>
      <div style="text-align:right;margin-top:8px">
        <span style="color:#cbd5e1;font-size:12px">${theme.stocks.length}종목 →</span>
      </div>
    </div>`;
  });
  html += '</div>';
  html += renderMoreButton(displayCards.length);
  mainView.innerHTML = html;
}

// ─── 서브 렌더 (테마 상세) ───
function openSub(ti) {
  currentView = 'sub';
  currentThemeIdx = ti;
  const data = loadData();
  const theme = data.themes[ti];
  const mainView = document.getElementById('mainView');
  const subView = document.getElementById('subView');
  mainView.style.display = 'none';
  subView.style.display = 'block';

  // 종목에 실시간 데이터 결합
  const stocks = theme.stocks.map(s => {
    const live = s.code ? liveData[s.code] : null;
    return {
      ...s,
      price: live ? live.price : 0,
      change: live ? live.change : 0,
      rate: live ? live.rate : 0,
      up: live ? live.up : null,
      tradingValue: live ? live.tradingValue : 0
    };
  });

  // 등락률 순 정렬
  stocks.sort((a, b) => b.rate - a.rate);

  const data_all = loadData();
  const totalThemes = data_all.themes.length;
  const prevIdx = ti > 0 ? ti - 1 : totalThemes - 1;
  const nextIdx = ti < totalThemes - 1 ? ti + 1 : 0;

  let html = `
    <div class="sub-header">
      <span class="sub-back" onclick="renderMain()">← </span>
      <h2>${theme.name}</h2>
      <span style="color:#64748b;font-size:14px">${stocks.length}종목</span>
      <div class="sub-nav">
        <span class="sub-arrow" onclick="openSub(${prevIdx})" title="${data_all.themes[prevIdx].name}">◀ 이전</span>
        <span style="color:#475569;font-size:12px">${ti+1} / ${totalThemes}</span>
        <span class="sub-arrow" onclick="openSub(${nextIdx})" title="${data_all.themes[nextIdx].name}">다음 ▶</span>
      </div>
    </div>
    <div style="overflow-x:auto">
    <table class="stock-table">
      <thead>
        <tr>
          <th style="width:30px">#</th>
          <th>종목</th>
          <th class="price">현재가</th>
          <th class="rate">등락률</th>
          <th class="tv">거래대금</th>
        </tr>
      </thead>
      <tbody>`;

  // 원본 데이터에서 이 종목의 실제 인덱스를 찾기 위해 매핑
  const origStocks = theme.stocks;
  stocks.forEach((s, i) => {
    const rateClass = s.rate > 0 ? 'up' : s.rate < 0 ? 'down' : 'flat';
    const rankBg = i < 5 ? RC[i] : '';
    // 원본 인덱스 찾기 (정렬 전 위치)
    const origIdx = origStocks.findIndex(os => os.name === s.name && os.code === s.code);
    html += `<tr class="editable" onclick="openEdit(${ti},${origIdx},'${s.name.replace(/'/g,"\\'")}','${s.code||''}','${(s.desc||'').replace(/'/g,"\\'")}')">
      <td>${i < 5 ? `<span class="rk-badge ${rankBg}">${i+1}</span>` : `<span style="color:#475569">${i+1}</span>`}</td>
      <td>
        <div class="sn">${s.name} ${s.code ? `<span class="sc">${s.code}</span>` : ''} <span style="color:#cbd5e1;font-size:10px">✏️</span></div>
        ${s.desc ? `<div class="sd">${s.desc}</div>` : ''}
        ${s.tags && s.tags.length ? `<div class="st-tags">${s.tags.map(t => `<span class="st-tag">#${t}</span>`).join('')}</div>` : ''}
      </td>
      <td class="price">${s.price ? fPrice(s.price) : '-'}</td>
      <td class="rate ${rateClass}">${s.price ? fRate(s.rate) : '-'}</td>
      <td class="tv">${s.price ? fTV(s.tradingValue) : '-'}</td>
    </tr>`;
  });
  html += `</tbody></table></div>`;
  subView.innerHTML = html;
}

// ─── 검색 ───
function renderSearch() {
  const query = document.getElementById('searchInput').value.toLowerCase().trim();
  if (!query) {
    if (currentView === 'main') renderMain();
    return;
  }
  const data = loadData();
  const results = [];
  data.themes.forEach(theme => {
    theme.stocks.forEach(s => {
      const matchName = s.name.toLowerCase().includes(query);
      const matchCode = s.code && s.code.includes(query);
      const matchTag = s.tags && s.tags.some(t => t.toLowerCase().includes(query));
      if (matchName || matchCode || matchTag) {
        const live = s.code ? liveData[s.code] : null;
        results.push({
          ...s, theme: theme.name,
          price: live ? live.price : 0,
          rate: live ? live.rate : 0,
          up: live ? live.up : null,
          tradingValue: live ? live.tradingValue : 0
        });
      }
    });
  });

  const mainView = document.getElementById('mainView');
  document.getElementById('subView').style.display = 'none';
  mainView.style.display = 'block';

  if (results.length === 0) {
    mainView.innerHTML = `<div class="empty"><div class="empty-icon">🔍</div><div class="empty-text">"${query}" 검색 결과가 없습니다</div></div>`;
    return;
  }

  let html = `<div style="margin-bottom:12px;color:#94a3b8;font-size:13px">"${query}" 검색결과 ${results.length}건</div>
  <table class="stock-table"><thead><tr>
    <th>종목</th><th>테마</th><th class="price">현재가</th><th class="rate">등락률</th>
  </tr></thead><tbody>`;
  results.forEach(s => {
    const rateClass = s.rate > 0 ? 'up' : s.rate < 0 ? 'down' : 'flat';
    html += `<tr>
      <td><span class="sn">${s.name}</span> ${s.code ? `<span class="sc">${s.code}</span>` : ''}</td>
      <td><span style="color:#60a5fa;font-size:12px">#${s.theme}</span></td>
      <td class="price">${s.price ? fPrice(s.price) : '-'}</td>
      <td class="rate ${rateClass}">${s.price ? fRate(s.rate) : '-'}</td>
    </tr>`;
  });
  html += '</tbody></table>';
  mainView.innerHTML = html;
}

// ─── 시세 불러오기 (한국투자증권 API) ───
async function fetchAll() {
  const data = loadData();
  const btn = document.getElementById('rfB');
  const bg = document.getElementById('stB');
  const pa = document.getElementById('pgA');
  const pf = document.getElementById('pgF');
  const pt = document.getElementById('pgT');

  // 모든 종목코드 수집 (중복 제거)
  const allCodes = new Set();
  data.themes.forEach(t => t.stocks.forEach(s => { if (s.code) allCodes.add(s.code); }));

  if (allCodes.size === 0) {
    document.getElementById('errA').innerHTML = '<div class="error-msg">⚠️ 종목코드가 입력된 종목이 없어요. "종목 관리"에서 6자리 종목코드를 넣어주세요.</div>';
    return;
  }

  btn.disabled = true;
  btn.textContent = '⏳ 토큰 준비 중...';
  bg.className = 'st ld';
  bg.textContent = '⏳ 수신중';
  pa.style.display = 'block';
  document.getElementById('errA').innerHTML = '';

  // 토큰을 딱 1번만 미리 받아온 다음, 모든 요청에 재사용 (동시 요청으로 인한 중복 토큰 발급 방지)
  let sharedToken = null;
  try {
    const tokenRes = await fetch('/api/stock?action=token');
    const tokenData = await tokenRes.json();
    if (tokenData.success) sharedToken = tokenData.token;
  } catch (e) {}

  btn.textContent = '⏳ 불러오는 중...';

  let done = 0, ok = 0;
  const total = allCodes.size;
  const codeList = Array.from(allCodes);
  const BATCH_SIZE = 5; // 한 번에 5개씩만 동시 요청 (API 제재 방지)
  const BATCH_DELAY = 250; // 배치 사이 대기 시간(ms)
  const failedCodes = new Set();
  const tokenParam = sharedToken ? `&token=${sharedToken}` : '';

  async function fetchOne(code, isRetry) {
    try {
      const res = await fetch('/api/stock?code=' + code + tokenParam);
      const d = await res.json();
      if (d.success) {
        liveData[code] = d;
        ok++;
        failedCodes.delete(code);
      } else {
        failedCodes.add(code);
      }
    } catch(e) {
      failedCodes.add(code);
    }
    if (!isRetry) {
      done++;
      pf.style.width = Math.round(done / total * 100) + '%';
      pt.textContent = `${done}/${total} 종목 (성공:${ok})`;
    }
  }

  for (let i = 0; i < codeList.length; i += BATCH_SIZE) {
    const batch = codeList.slice(i, i + BATCH_SIZE);
    await Promise.all(batch.map(c => fetchOne(c, false)));
    await new Promise(r => setTimeout(r, BATCH_DELAY));
  }

  // 실패한 종목 자동 재시도 (최대 2회)
  for (let retryRound = 1; retryRound <= 2 && failedCodes.size > 0; retryRound++) {
    const retryList = Array.from(failedCodes);
    pt.textContent = `재시도 중... (${retryList.length}개 종목, ${retryRound}차)`;
    for (let i = 0; i < retryList.length; i += BATCH_SIZE) {
      const batch = retryList.slice(i, i + BATCH_SIZE);
      await Promise.all(batch.map(c => fetchOne(c, true)));
      await new Promise(r => setTimeout(r, BATCH_DELAY));
    }
    pt.textContent = `${total}/${total} 종목 (성공:${ok}, 재시도 ${retryRound}차 완료)`;
  }

  // 렌더 갱신
  if (currentView === 'main') renderMain();
  else if (currentView === 'sub') openSub(currentThemeIdx);

  // 시세 데이터를 localStorage에 저장 (껐다 켜도 유지)
  saveLiveData();

  const ts = new Date().toLocaleString('ko-KR', { hour:'2-digit', minute:'2-digit', second:'2-digit' });
  if (ok === 0) {
    document.getElementById('errA').innerHTML = '<div class="error-msg">❌ API 연결 실패. Vercel 환경변수(KIS_APPKEY, KIS_APPSECRET)를 확인하세요.</div>';
    bg.className = 'st off';
    bg.textContent = '❌ 실패';
  } else {
    bg.className = 'st on';
    bg.textContent = `🟢 실시간 · ${ts}`;
    if (failedCodes.size > 0) {
      document.getElementById('errA').innerHTML = `<div class="error-msg">⚠️ ${failedCodes.size}개 종목은 2번 재시도해도 실패했어요. "🔄 시세 불러오기"를 한 번 더 눌러보세요.</div>`;
    }
  }
  btn.disabled = false;
  btn.textContent = '🔄 시세 불러오기';
  setTimeout(() => { pa.style.display = 'none'; }, 2000);
}

// ─── 종목 편집 (대시보드에서 직접 수정) ───
let editThemeIdx = -1;
let editStockIdx = -1;
let editOldName = '';
let editOldCode = '';

function openEdit(ti, si, name, code, desc) {
  editThemeIdx = ti;
  editStockIdx = si;
  editOldName = name;
  editOldCode = code;
  document.getElementById('editTitle').textContent = `${name} 수정`;
  document.getElementById('editName').value = name;
  document.getElementById('editCode').value = code;
  document.getElementById('editDesc').value = desc;
  document.getElementById('editModal').classList.add('show');
}

function closeEdit() {
  document.getElementById('editModal').classList.remove('show');
}

function saveEdit() {
  const newName = document.getElementById('editName').value.trim();
  const newCode = document.getElementById('editCode').value.trim();
  const newDesc = document.getElementById('editDesc').value.trim();
  if (!newName) return;

  const data = loadData();
  // 현재 테마의 해당 종목 수정
  if (data.themes[editThemeIdx] && data.themes[editThemeIdx].stocks[editStockIdx]) {
    data.themes[editThemeIdx].stocks[editStockIdx].name = newName;
    data.themes[editThemeIdx].stocks[editStockIdx].code = newCode;
    data.themes[editThemeIdx].stocks[editStockIdx].desc = newDesc;
  }

  // 다른 테마에 같은 종목 동기화
  let syncCount = 0;
  data.themes.forEach((theme, tIdx) => {
    if (tIdx === editThemeIdx) return;
    theme.stocks.forEach((s, sIdx) => {
      const matchByName = editOldName && s.name === editOldName;
      const matchByCode = editOldCode && s.code === editOldCode;
      if (matchByName || matchByCode) {
        data.themes[tIdx].stocks[sIdx].name = newName;
        data.themes[tIdx].stocks[sIdx].code = newCode;
        data.themes[tIdx].stocks[sIdx].desc = newDesc;
        syncCount++;
      }
    });
  });

  saveData(data);
  closeEdit();
  openSub(editThemeIdx);

  const toast = document.getElementById('editToast');
  toast.textContent = syncCount > 0
    ? `"${newName}" 수정됨 (다른 테마 ${syncCount}곳 동기화)`
    : `"${newName}" 수정됨`;
  toast.style.display = 'block';
  setTimeout(() => { toast.style.display = 'none'; }, 2500);
}

// 모달 밖 클릭하면 닫기 (모달 박스 안 클릭은 무시)
document.getElementById('editModal').addEventListener('click', function(e) {
  if (e.target === this) closeEdit();
});
document.querySelector('.modal-box').addEventListener('click', function(e) {
  e.stopPropagation();
});

// ─── 데이터 가져오기 (서버에서 최신 데이터 자동 로드) ───
async function importData() {
  const toast = document.getElementById('editToast');
  try {
    toast.textContent = '📥 데이터 가져오는 중...';
    toast.style.display = 'block';
    const res = await fetch('/data.json?' + Date.now());
    if (!res.ok) throw new Error('파일을 찾을 수 없습니다');
    const data = await res.json();
    data.lastUpdated = new Date().toISOString();
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    toast.textContent = '✅ 테마 ' + data.themes.length + '개 데이터 가져오기 완료!';
    setTimeout(() => { toast.style.display = 'none'; location.reload(); }, 1500);
  } catch (e) {
    toast.style.background = '#450a0a';
    toast.style.color = '#fca5a5';
    toast.textContent = '❌ 데이터 가져오기 실패: ' + e.message;
    setTimeout(() => { toast.style.display = 'none'; toast.style.background = '#065f46'; toast.style.color = '#6ee7b7'; }, 3000);
  }
}

// ─── 초기: 저장된 시세 및 필터 상태 불러오기 ───
viewMode = loadViewMode();
const savedAt = loadLiveData();
