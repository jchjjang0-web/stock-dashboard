<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>주식 테마 대시보드</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,'Segoe UI',sans-serif;background:#0a0e1a;color:#e2e8f0;min-height:100vh}

/* 헤더 */
.header{background:#111827;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #1e293b;position:sticky;top:0;z-index:100}
.header h1{font-size:18px;color:#f1f5f9}
.header-right{display:flex;gap:8px;align-items:center}
.btn{padding:8px 14px;border-radius:8px;border:none;font-size:13px;cursor:pointer;font-weight:600;transition:all .2s}
.btn-primary{background:#2563eb;color:#fff}
.btn-primary:hover{background:#1d4ed8}
.btn-secondary{background:#1e293b;color:#94a3b8}
.btn-secondary:hover{background:#334155}
.btn-small{padding:5px 10px;font-size:12px}
.st{font-size:11px;padding:4px 10px;border-radius:8px;font-weight:600}
.st.off{background:#1e293b;color:#64748b}
.st.on{background:#064e3b;color:#6ee7b7}
.st.ld{background:#78350f;color:#fbbf24}

/* 상태 바 */
.status-bar{background:#111827;padding:10px 20px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #1e293b;flex-wrap:wrap}
.prog-area{display:none;flex:1;min-width:200px}
.prog-bar{height:4px;background:#1e293b;border-radius:2px;overflow:hidden}
.prog-fill{height:100%;background:#2563eb;width:0%;transition:width .3s}
.prog-text{font-size:11px;color:#64748b;margin-top:4px}

/* 컨테이너 */
.container{max-width:1200px;margin:0 auto;padding:16px}

/* 검색 */
.search-bar{position:relative;margin-bottom:16px}
.search-bar input{width:100%;padding:12px 16px 12px 40px;border-radius:12px;border:1px solid #1e293b;background:#111827;color:#e2e8f0;font-size:14px;outline:none}
.search-bar input:focus{border-color:#2563eb}
.search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#64748b}

/* 빈 상태 */
.empty{text-align:center;padding:60px 20px;color:#64748b}
.empty-icon{font-size:56px;margin-bottom:16px}
.empty-text{font-size:15px;line-height:1.8}
.empty .btn{margin-top:16px}

/* 메인 화면: 테마 카드 그리드 */
.theme-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.tc{background:#111827;border-radius:12px;padding:16px;cursor:pointer;border:1px solid #1e293b;transition:all .2s}
.tc:hover{border-color:#334155;transform:translateY(-2px)}
.tc-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.tc-name{font-size:16px;font-weight:700;color:#f1f5f9}
.tc-str{font-size:14px;font-weight:700}
.tc-str.up{color:#ef4444}
.tc-str.down{color:#3b82f6}
.tc-str.flat{color:#64748b}
.tc-list{display:flex;flex-direction:column;gap:6px}
.tc-row{display:flex;align-items:center;gap:8px}
.tc-rk{width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff}
.rk1{background:#ef4444}
.rk2{background:#f97316}
.rk3{background:#eab308}
.rk4{background:#64748b}
.rk5{background:#475569}
.tc-sn{font-size:13px;color:#e2e8f0;flex:1}
.tc-sr{font-size:13px;font-weight:700}
.tc-sr.up{color:#ef4444}
.tc-sr.down{color:#3b82f6}
.tc-sr.flat{color:#64748b}
.tc-crown{margin-top:8px;padding-top:8px;border-top:1px solid #1e293b;font-size:12px;color:#94a3b8}
.tc-crown .tcn{color:#fbbf24;font-weight:600}
.tc-crown .tcv{color:#64748b}
.tc-empty{color:#475569;font-size:12px;padding:8px 0}
.tc-arrow{color:#334155;font-size:18px}

/* 서브 화면 */
.sub-header{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.sub-header h2{font-size:20px;font-weight:700;color:#f1f5f9}
.sub-back{cursor:pointer;font-size:24px;color:#64748b}
.sub-back:hover{color:#e2e8f0}

/* 서브 테이블 */
.stock-table{width:100%;border-collapse:collapse}
.stock-table th{text-align:left;padding:10px 12px;font-size:12px;color:#64748b;border-bottom:1px solid #1e293b;position:sticky;top:0;background:#0a0e1a}
.stock-table td{padding:10px 12px;font-size:13px;border-bottom:1px solid #0f172a}
.stock-table tr:hover td{background:#111827}
.sn{font-weight:600;color:#e2e8f0}
.sc{color:#64748b;font-size:11px}
.sd{color:#64748b;font-size:11px;margin-top:2px}
.st-tags{display:flex;gap:3px;flex-wrap:wrap;margin-top:3px}
.st-tag{font-size:10px;background:#1e3a5f;color:#60a5fa;padding:1px 6px;border-radius:8px}
.price{text-align:right}
.rate{text-align:right;font-weight:700}
.rate.up{color:#ef4444}
.rate.down{color:#3b82f6}
.rate.flat{color:#64748b}
.tv{text-align:right;color:#94a3b8;font-size:12px}
.rk-badge{display:inline-block;width:20px;height:20px;border-radius:5px;text-align:center;line-height:20px;font-size:10px;font-weight:800;color:#fff;margin-right:6px}

/* 에러 */
.error-msg{background:#450a0a;color:#fca5a5;padding:12px 16px;border-radius:10px;font-size:13px;margin:10px 0}

@media(max-width:600px){
  .theme-grid{grid-template-columns:1fr}
  .header h1{font-size:15px}
}
</style>
</head>
<body>

<div class="header">
  <h1>📊 주식 테마 대시보드</h1>
  <div class="header-right">
    <span class="st off" id="stB">⏸ 대기중</span>
    <button class="btn btn-primary btn-small" id="rfB" onclick="fetchAll()">🔄 시세 불러오기</button>
    <button class="btn btn-secondary btn-small" onclick="location.href='themes.html'">📋 종목 관리</button>
  </div>
</div>

<div class="status-bar">
  <div class="prog-area" id="pgA">
    <div class="prog-bar"><div class="prog-fill" id="pgF"></div></div>
    <div class="prog-text" id="pgT"></div>
  </div>
  <div id="errA"></div>
</div>

<div class="container">
  <!-- 검색 -->
  <div class="search-bar">
    <span class="search-icon">🔍</span>
    <input type="text" id="searchInput" placeholder="종목명, 태그로 검색" oninput="renderSearch()">
  </div>

  <!-- 메인 뷰 -->
  <div id="mainView"></div>

  <!-- 서브 뷰 -->
  <div id="subView" style="display:none"></div>
</div>

<script>
// ─── 데이터 ───
const STORAGE_KEY = 'stock-dashboard-data';
let liveData = {}; // code -> {price, change, rate, up, tradingValue, ...}
let currentView = 'main'; // main | sub
let currentThemeIdx = -1;

function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch(e) {}
  return { themes: [], version: 1 };
}

// ─── 포맷 유틸 ───
function fPrice(v) { return v ? v.toLocaleString() + '원' : '-'; }
function fRate(v) { 
  if (v === null || v === undefined) return '-';
  const sign = v > 0 ? '+' : '';
  return sign + v.toFixed(2) + '%';
}
function fTV(v) {
  if (!v) return '-';
  if (v >= 1000000000000) return (v/1000000000000).toFixed(1) + '조';
  if (v >= 100000000) return (v/100000000).toFixed(0) + '억';
  if (v >= 10000) return (v/10000).toFixed(0) + '만';
  return v.toLocaleString();
}

const RC = ['rk1','rk2','rk3','rk4','rk5'];

// ─── 메인 렌더 ───
function renderMain() {
  const data = loadData();
  const mainView = document.getElementById('mainView');
  const subView = document.getElementById('subView');
  mainView.style.display = 'block';
  subView.style.display = 'none';
  currentView = 'main';

  if (data.themes.length === 0) {
    mainView.innerHTML = `
      <div class="empty">
        <div class="empty-icon">📁</div>
        <div class="empty-text">
          아직 등록된 테마가 없어요!<br>
          "종목 관리" 페이지에서 테마와 종목을 추가하면<br>
          여기에 대시보드가 나타납니다.
        </div>
        <button class="btn btn-primary" onclick="location.href='themes.html'" style="margin-top:16px">📋 종목 관리로 이동</button>
      </div>`;
    return;
  }

  // 테마별 데이터 계산 (실시간 데이터 결합)
  const themeCards = data.themes.map((theme, ti) => {
    const stocks = theme.stocks.map(s => {
      const live = s.code ? liveData[s.code] : null;
      return {
        ...s,
        price: live ? live.price : 0,
        change: live ? live.change : 0,
        rate: live ? live.rate : 0,
        up: live ? live.up : null,
        tradingValue: live ? live.tradingValue : 0
      };
    });

    // 상승 종목 TOP5
    const top5 = stocks
      .filter(s => s.rate > 0)
      .sort((a, b) => b.rate - a.rate)
      .slice(0, 5);

    // 거래대금 대장주
    const tvKing = stocks.filter(s => s.tradingValue > 0)
      .sort((a, b) => b.tradingValue - a.tradingValue)[0] || null;

    // 평균 등락률 (테마 강도)
    const ratesWithData = stocks.filter(s => s.rate !== 0);
    const avgRate = ratesWithData.length > 0
      ? ratesWithData.reduce((s, st) => s + st.rate, 0) / ratesWithData.length
      : 0;

    return { theme, ti, stocks, top5, tvKing, avgRate };
  });

  // 테마 강도 순 정렬 (평균 등락률이 높은 테마가 위로)
  themeCards.sort((a, b) => b.avgRate - a.avgRate);

  let html = '<div class="theme-grid">';
  themeCards.forEach(({ theme, ti, top5, tvKing, avgRate }) => {
    const rateClass = avgRate > 0 ? 'up' : avgRate < 0 ? 'down' : 'flat';
    const rateStr = avgRate !== 0 ? (avgRate > 0 ? '+' : '') + avgRate.toFixed(2) + '%' : '-';

    html += `<div class="tc" onclick="openSub(${ti})">
      <div class="tc-head">
        <span class="tc-name">${theme.name}</span>
        <span class="tc-str ${rateClass}">${rateStr}</span>
      </div>
      <div class="tc-list">`;

    if (top5.length > 0) {
      top5.forEach((s, j) => {
        html += `<div class="tc-row">
          <div class="tc-rk ${RC[j]}">${j+1}</div>
          <span class="tc-sn">${s.name}</span>
          <span class="tc-sr up">+${s.rate.toFixed(2)}%</span>
        </div>`;
      });
    } else {
      html += `<div class="tc-empty">시세를 불러오면 상승 TOP5가 표시됩니다</div>`;
    }

    if (tvKing) {
      html += `<div class="tc-crown">👑 거래대금 <span class="tcn">${tvKing.name}</span> <span class="tcv">${fTV(tvKing.tradingValue)}</span></div>`;
    }

    html += `</div>
      <div style="text-align:right;margin-top:8px">
        <span style="color:#334155;font-size:12px">${theme.stocks.length}종목 →</span>
      </div>
    </div>`;
  });
  html += '</div>';
  mainView.innerHTML = html;
}

// ─── 서브 렌더 (테마 상세) ───
function openSub(ti) {
  currentView = 'sub';
  currentThemeIdx = ti;
  const data = loadData();
  const theme = data.themes[ti];
  const mainView = document.getElementById('mainView');
  const subView = document.getElementById('subView');
  mainView.style.display = 'none';
  subView.style.display = 'block';

  // 종목에 실시간 데이터 결합
  const stocks = theme.stocks.map(s => {
    const live = s.code ? liveData[s.code] : null;
    return {
      ...s,
      price: live ? live.price : 0,
      change: live ? live.change : 0,
      rate: live ? live.rate : 0,
      up: live ? live.up : null,
      tradingValue: live ? live.tradingValue : 0
    };
  });

  // 등락률 순 정렬
  stocks.sort((a, b) => b.rate - a.rate);

  let html = `
    <div class="sub-header">
      <span class="sub-back" onclick="renderMain()">← </span>
      <h2>${theme.name}</h2>
      <span style="color:#64748b;font-size:14px">${stocks.length}종목</span>
    </div>
    <div style="overflow-x:auto">
    <table class="stock-table">
      <thead>
        <tr>
          <th style="width:30px">#</th>
          <th>종목</th>
          <th class="price">현재가</th>
          <th class="rate">등락률</th>
          <th class="tv">거래대금</th>
        </tr>
      </thead>
      <tbody>`;

  stocks.forEach((s, i) => {
    const rateClass = s.rate > 0 ? 'up' : s.rate < 0 ? 'down' : 'flat';
    const rankBg = i < 5 ? RC[i] : '';
    html += `<tr>
      <td>${i < 5 ? `<span class="rk-badge ${rankBg}">${i+1}</span>` : `<span style="color:#475569">${i+1}</span>`}</td>
      <td>
        <div class="sn">${s.name} ${s.code ? `<span class="sc">${s.code}</span>` : ''}</div>
        ${s.desc ? `<div class="sd">${s.desc}</div>` : ''}
        ${s.tags && s.tags.length ? `<div class="st-tags">${s.tags.map(t => `<span class="st-tag">#${t}</span>`).join('')}</div>` : ''}
      </td>
      <td class="price">${s.price ? fPrice(s.price) : '-'}</td>
      <td class="rate ${rateClass}">${s.rate ? fRate(s.rate) : '-'}</td>
      <td class="tv">${s.tradingValue ? fTV(s.tradingValue) : '-'}</td>
    </tr>`;
  });

  html += `</tbody></table></div>`;
  subView.innerHTML = html;
}

// ─── 검색 ───
function renderSearch() {
  const query = document.getElementById('searchInput').value.toLowerCase().trim();
  if (!query) {
    if (currentView === 'main') renderMain();
    return;
  }

  const data = loadData();
  const results = [];
  data.themes.forEach(theme => {
    theme.stocks.forEach(s => {
      const matchName = s.name.toLowerCase().includes(query);
      const matchCode = s.code && s.code.includes(query);
      const matchTag = s.tags && s.tags.some(t => t.toLowerCase().includes(query));
      if (matchName || matchCode || matchTag) {
        const live = s.code ? liveData[s.code] : null;
        results.push({
          ...s, theme: theme.name,
          price: live ? live.price : 0,
          rate: live ? live.rate : 0,
          up: live ? live.up : null,
          tradingValue: live ? live.tradingValue : 0
        });
      }
    });
  });

  const mainView = document.getElementById('mainView');
  document.getElementById('subView').style.display = 'none';
  mainView.style.display = 'block';

  if (results.length === 0) {
    mainView.innerHTML = `<div class="empty"><div class="empty-icon">🔍</div><div class="empty-text">"${query}" 검색 결과가 없습니다</div></div>`;
    return;
  }

  let html = `<div style="margin-bottom:12px;color:#94a3b8;font-size:13px">"${query}" 검색결과 ${results.length}건</div>
    <table class="stock-table"><thead><tr>
      <th>종목</th><th>테마</th><th class="price">현재가</th><th class="rate">등락률</th>
    </tr></thead><tbody>`;
  results.forEach(s => {
    const rateClass = s.rate > 0 ? 'up' : s.rate < 0 ? 'down' : 'flat';
    html += `<tr>
      <td><span class="sn">${s.name}</span> ${s.code ? `<span class="sc">${s.code}</span>` : ''}</td>
      <td><span style="color:#60a5fa;font-size:12px">#${s.theme}</span></td>
      <td class="price">${s.price ? fPrice(s.price) : '-'}</td>
      <td class="rate ${rateClass}">${s.rate ? fRate(s.rate) : '-'}</td>
    </tr>`;
  });
  html += '</tbody></table>';
  mainView.innerHTML = html;
}

// ─── 시세 불러오기 (한국투자증권 API) ───
async function fetchAll() {
  const data = loadData();
  const btn = document.getElementById('rfB');
  const bg = document.getElementById('stB');
  const pa = document.getElementById('pgA');
  const pf = document.getElementById('pgF');
  const pt = document.getElementById('pgT');

  // 모든 종목코드 수집 (중복 제거)
  const allCodes = new Set();
  data.themes.forEach(t => t.stocks.forEach(s => { if (s.code) allCodes.add(s.code); }));

  if (allCodes.size === 0) {
    document.getElementById('errA').innerHTML = '<div class="error-msg">⚠️ 종목코드가 입력된 종목이 없어요. "종목 관리"에서 6자리 종목코드를 넣어주세요.</div>';
    return;
  }

  btn.disabled = true;
  btn.textContent = '⏳ 불러오는 중...';
  bg.className = 'st ld';
  bg.textContent = '⏳ 수신중';
  pa.style.display = 'block';
  document.getElementById('errA').innerHTML = '';

  let done = 0, ok = 0;
  const total = allCodes.size;

  for (const code of allCodes) {
    try {
      const res = await fetch('/api/stock?code=' + code);
      const d = await res.json();
      if (d.success) {
        liveData[code] = d;
        ok++;
      }
    } catch(e) {}
    done++;
    pf.style.width = Math.round(done / total * 100) + '%';
    pt.textContent = `${done}/${total} 종목 (성공:${ok})`;
    await new Promise(r => setTimeout(r, 55));
  }

  // 렌더 갱신
  if (currentView === 'main') renderMain();
  else if (currentView === 'sub') openSub(currentThemeIdx);

  const ts = new Date().toLocaleString('ko-KR', { hour:'2-digit', minute:'2-digit', second:'2-digit' });
  if (ok === 0) {
    document.getElementById('errA').innerHTML = '<div class="error-msg">❌ API 연결 실패. Vercel 환경변수(KIS_APPKEY, KIS_APPSECRET)를 확인하세요.</div>';
    bg.className = 'st off';
    bg.textContent = '❌ 실패';
  } else {
    bg.className = 'st on';
    bg.textContent = `🟢 실시간 · ${ts}`;
  }
  btn.disabled = false;
  btn.textContent = '🔄 시세 불러오기';
  setTimeout(() => { pa.style.display = 'none'; }, 2000);
}

// ─── 초기 렌더 ───
renderMain();
</script>
</body>
</html>
