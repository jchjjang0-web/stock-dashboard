.header-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.status{font-size:12px;padding:5px 12px;border-radius:16px;font-weight:600}
.status.live{background:#22c55e20;color:#4ade80}
.status.off{background:#ef444420;color:#f87171}
.status.loading{background:#f59e0b20;color:#fbbf24}
.btn{padding:8px 16px;border-radius:10px;border:1px solid #2a2f3e;background:#1a1f2e;color:#e2e4e9;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s;font-family:inherit}
.btn:hover{background:#252b3d;border-color:#3b4260}
.btn.primary{background:#3b82f6;border-color:#3b82f6;color:#fff}
.btn.primary:hover{background:#2563eb}
.btn:disabled{opacity:.5;cursor:not-allowed}
.progress-bar{width:100%;max-width:960px;margin:0 auto;padding:0 16px}
.progress-track{height:4px;background:#1e2333;border-radius:2px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,#3b82f6,#22c55e);border-radius:2px;transition:width .3s;width:0%}
.progress-text{font-size:11px;color:#6b7280;text-align:center;padding:6px 0}
.nav-wrap{position:sticky;top:0;z-index:100;background:#131620ee;backdrop-filter:blur(12px);border-bottom:1px solid #1e2333;padding:10px 16px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.nav-wrap::-webkit-scrollbar{display:none}
.nav{display:flex;gap:6px;min-width:max-content}
.nav a{display:inline-block;padding:6px 14px;border-radius:20px;font-size:13px;font-weight:600;color:#8b92a5;background:#1a1f2e;text-decoration:none;white-space:nowrap;transition:all .2s;border:1px solid transparent}
.nav a:hover{color:#fff;background:#252b3d;border-color:#3b4260}
.container{max-width:960px;margin:0 auto;padding:20px 16px 80px}
.sector{margin-bottom:28px;border-radius:14px;background:#161a26;border:1px solid #1e2333;overflow:hidden}
.sector-head{display:flex;align-items:center;gap:10px;padding:16px 18px 12px;border-bottom:1px solid #1e2333}
.sector-icon{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.sector-head h2{font-size:17px;font-weight:800;color:#fff}
.sector-head .count{margin-left:auto;font-size:11px;color:#6b7280;background:#1e2333;padding:3px 10px;border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{padding:9px 14px;font-weight:600;color:#6b7280;text-align:left;font-size:11px;background:#131620}
thead th:nth-child(2),thead th:nth-child(3),thead th:nth-child(4){text-align:right}
tbody tr{border-top:1px solid #1a1e2a;transition:background .15s}
tbody tr:hover{background:#1a1f2e}
td{padding:9px 14px;vertical-align:top}
td:nth-child(2),td:nth-child(3),td:nth-child(4){text-align:right;font-variant-numeric:tabular-nums}
.sn{font-weight:700;color:#e2e4e9}
.sr{display:block;font-size:11px;color:#6b7280;margin-top:1px;line-height:1.4}
.price{font-weight:600;color:#d1d5db}
.up{color:#ef4444}.down{color:#3b82f6}.flat{color:#6b7280}
.leader{display:inline-block;font-size:9px;font-weight:700;background:#ef444420;color:#f87171;padding:1px 6px;border-radius:4px;margin-left:5px;vertical-align:middle}
.updated-at{text-align:center;padding:14px;font-size:11px;color:#4b5563}
.bg-semi{background:#6366f120}.bg-mlcc{background:#8b5cf620}.bg-ai{background:#06b6d420}.bg-robot{background:#10b98120}
.bg-power{background:#f59e0b20}.bg-nuke{background:#ef444420}.bg-solar{background:#f9731620}.bg-batt{background:#22c55e20}
.bg-oil{background:#78716c20}.bg-space{background:#818cf820}.bg-optic{background:#a78bfa20}.bg-coin{background:#fbbf2420}

.bg-beauty{background:#f472b620}.bg-nk{background:#fb923c20}
.error-msg{background:#ef444420;border:1px solid #ef444440;border-radius:10px;padding:16px;margin:16px;color:#f87171;font-size:13px;text-align:center}
.settings-bar{background:#1a1f2e;border:1px solid #2a2f3e;border-radius:10px;padding:12px 16px;margin-bottom:20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}

</style>

let refreshTimer=null;
let totalStocks=0;

function init(){
  THEMES.forEach(t=>totalStocks+=t.stocks.length);
  const navHtml=THEMES.map(t=>`<a href="#${t.id}">${t.icon} ${t.name}</a>`).join('');
  document.getElementById('navBar').innerHTML=navHtml;
  let html='';
  THEMES.forEach(t=>{
    html+=`<div class="sector" id="${t.id}"><div class="sector-head"><div class="sector-icon ${t.bg}">${t.icon}</div><h2>${t.name}</h2><span class="count">${t.stocks.length}종목</span></div><table><thead><tr><th>종목명</th><th>현재가</th><th>전일비</th><th>등락률</th></tr></thead><tbody>`;
    t.stocks.forEach(s=>{
      const a=s.up===1?'▲':s.up===0?'▼':'-';
      const c=s.up===1?'up':s.up===0?'down':'flat';
      const sg=s.up===1?'+':s.up===0?'-':'';
      const ld=s.leader?'<span class="leader">대장주</span>':'';
      html+=`<tr data-code="${s.code}"><td><span class="sn">${s.name}${ld}</span><span class="sr">${s.role}</span></td><td class="price">${s.price.toLocaleString()}</td><td class="${c}">${a} ${Math.abs(s.change).toLocaleString()}</td><td class="${c}">${sg}${Math.abs(s.rate).toFixed(2)}%</td></tr>`;
    });
    html+=`</tbody></table><div class="updated-at" id="time-${t.id}">📋 초기 데이터 · 🔄 버튼을 눌러 실시간 업데이트</div></div>`;
  });
  document.getElementById('dashboard').innerHTML=html;
  document.querySelectorAll('.nav a').forEach(a=>{
    a.addEventListener('click',e=>{
      e.preventDefault();
      const target=document.querySelector(a.getAttribute('href'));
      if(target){const nh=document.querySelector('.nav-wrap').offsetHeight;window.scrollTo({top:target.offsetTop-nh-12,behavior:'smooth'});}
    });
  });
}

function updateRow(code,data){
  const row=document.querySelector(`tr[data-code="${code}"]`);
  if(!row)return;
  const cells=row.querySelectorAll('td');
  cells[1].textContent=data.price.toLocaleString();cells[1].className='price';
  const a=data.up===true?'▲':data.up===false?'▼':'-';
  const c=data.up===true?'up':data.up===false?'down':'flat';
  cells[2].textContent=a+' '+Math.abs(data.change).toLocaleString();cells[2].className=c;
  const sg=data.up===true?'+':data.up===false?'-':'';
  cells[3].textContent=sg+Math.abs(data.rate).toFixed(2)+'%';cells[3].className=c;
}

async function fetchAllPrices(){
  const btn=document.getElementById('refreshBtn');
  const badge=document.getElementById('statusBadge');
  const progArea=document.getElementById('progressArea');
  const progFill=document.getElementById('progressFill');
  const progText=document.getElementById('progressText');
  const errArea=document.getElementById('errorArea');

  btn.disabled=true;btn.textContent='⏳ 불러오는 중...';
  badge.className='status loading';badge.textContent='⏳ 데이터 수신 중';
  progArea.style.display='block';errArea.innerHTML='';

  let done=0,ok=0,fail=0;
  for(const theme of THEMES){
    for(const stock of theme.stocks){
      try{
        const res=await fetch('/api/stock?code='+stock.code);
        const data=await res.json();
        if(data.success){
          stock.price=data.price;stock.change=data.change;stock.rate=data.rate;stock.up=data.up;
          updateRow(stock.code,data);ok++;
        } else {fail++;}
      }catch(e){fail++;}
      done++;
      const pct=Math.round(done/totalStocks*100);
      progFill.style.width=pct+'%';
      progText.textContent=`${done}/${totalStocks} 종목 처리 중... (성공: ${ok} / 실패: ${fail})`;
      await new Promise(r=>setTimeout(r,55));
    }
  }

  const now=new Date();
  const timeStr=now.toLocaleString('ko-KR',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  document.querySelectorAll('.updated-at').forEach(el=>{el.textContent=`✅ 실시간 업데이트 완료 · ${timeStr}`;});

  if(fail>0&&ok===0){
    errArea.innerHTML='<div class="error-msg">❌ API 연결 실패 — Vercel 환경변수(KIS_APPKEY, KIS_APPSECRET)가 설정되었는지 확인하세요</div>';
    badge.className='status off';badge.textContent='❌ 연결 실패';
  } else {
    badge.className='status live';badge.textContent=`🟢 실시간 · ${timeStr}`;
  }
  btn.disabled=false;btn.textContent='🔄 시세 불러오기';
  setTimeout(()=>{progArea.style.display='none';},3000);
}

function setAutoRefresh(){
  if(refreshTimer)clearInterval(refreshTimer);
  const sec=parseInt(document.getElementById('refreshInterval').value);
  if(sec>0)refreshTimer=setInterval(fetchAllPrices,sec*1000);
}

init();
setAutoRefresh();
</script>
