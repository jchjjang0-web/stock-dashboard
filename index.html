<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>주식 테마 대시보드</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,'Segoe UI',sans-serif;background:#0a0e1a;color:#e2e8f0;min-height:100vh}
/* 헤더 */
.header{background:#111827;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #1e293b;position:sticky;top:0;z-index:100}
.header h1{font-size:18px;color:#f1f5f9}
.header-right{display:flex;gap:8px;align-items:center}
.btn{padding:8px 14px;border-radius:8px;border:none;font-size:13px;cursor:pointer;font-weight:600;transition:all .2s}
.btn-primary{background:#2563eb;color:#fff}
.btn-primary:hover{background:#1d4ed8}
.btn-secondary{background:#1e293b;color:#94a3b8}
.btn-secondary:hover{background:#334155}
.btn-small{padding:5px 10px;font-size:12px}
.btn-toggle{background:#78350f;color:#fbbf24}
.btn-toggle:hover{background:#92400e}
.st{font-size:11px;padding:4px 10px;border-radius:8px;font-weight:600}
.st.off{background:#1e293b;color:#64748b}
.st.on{background:#064e3b;color:#6ee7b7}
.st.ld{background:#78350f;color:#fbbf24}
/* 상태 바 */
.status-bar{background:#111827;padding:10px 20px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #1e293b;flex-wrap:wrap}
.prog-area{display:none;flex:1;min-width:200px}
.prog-bar{height:4px;background:#1e293b;border-radius:2px;overflow:hidden}
.prog-fill{height:100%;background:#2563eb;width:0%;transition:width .3s}
.prog-text{font-size:11px;color:#64748b;margin-top:4px}
/* 컨테이너 */
.container{max-width:1200px;margin:0 auto;padding:16px}
/* 검색 + 필터 바 */
.search-bar{position:relative;margin-bottom:10px}
.search-bar input{width:100%;padding:12px 16px 12px 40px;border-radius:12px;border:1px solid #1e293b;background:#111827;color:#e2e8f0;font-size:14px;outline:none}
.search-bar input:focus{border-color:#2563eb}
.search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#64748b}
.filter-bar{display:flex;align-items:center;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.filter-info{font-size:12px;color:#64748b}
/* 빈 상태 */
.empty{text-align:center;padding:60px 20px;color:#64748b}
.empty-icon{font-size:56px;margin-bottom:16px}
.empty-text{font-size:15px;line-height:1.8}
.empty .btn{margin-top:16px}
/* 메인 화면: 테마 카드 그리드 */
.theme-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.tc{background:#111827;border-radius:12px;padding:16px;cursor:pointer;border:1px solid #1e293b;transition:all .2s}
.tc:hover{border-color:#334155;transform:translateY(-2px)}
.tc-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.tc-name{font-size:16px;font-weight:700;color:#f1f5f9}
.tc-str{font-size:14px;font-weight:700}
.tc-str.up{color:#ef4444}
.tc-str.down{color:#3b82f6}
.tc-str.flat{color:#64748b}
.tc-list{display:flex;flex-direction:column;gap:6px}
.tc-row{display:flex;align-items:center;gap:8px}
.tc-rk{width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff}
.rk1{background:#ef4444}
.rk2{background:#f97316}
.rk3{background:#eab308}
.rk4{background:#64748b}
.rk5{background:#475569}
.tc-sn{font-size:13px;color:#e2e8f0;flex:1}
.tc-sr{font-size:13px;font-weight:700}
.tc-sr.up{color:#ef4444}
.tc-sr.down{color:#3b82f6}
.tc-sr.flat{color:#64748b}
.tc-tv{font-size:11px;color:#64748b;min-width:44px;text-align:right}
.tc-crown{margin-top:8px;padding-top:8px;border-top:1px solid #1e293b;font-size:12px;color:#94a3b8}
.tc-crown .tcn{color:#fbbf24;font-weight:600}
.tc-crown .tcv{color:#64748b}
.tc-empty{color:#475569;font-size:12px;padding:8px 0}
.tc-arrow{color:#334155;font-size:18px}
/* 테마 강도 배지 */
.tc-rank{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex-shrink:0}
.tc-rank.medal1{background:#facc15;color:#1e293b}
.tc-rank.medal2{background:#cbd5e1;color:#1e293b}
.tc-rank.medal3{background:#d97706;color:#1e293b}
.tc-rank.plain{background:#1e293b;color:#64748b}
.tc-head-left{display:flex;align-items:center;gap:8px}
.tc-stats{display:flex;gap:10px;margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid #1e293b;font-size:12px}
.tc-stat{display:flex;flex-direction:column;gap:2px}
.tc-stat-label{color:#64748b;font-size:10px}
.tc-stat-value{font-weight:700}
.tc-stat-value.up{color:#ef4444}
.tc-stat-value.down{color:#3b82f6}
.tc-stat-value.flat{color:#94a3b8}
/* 거래대금 순위 배지 */
.tv-rk{width:24px;height:18px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;background:#1e3a5f;color:#60a5fa;flex-shrink:0}
/* 서브 화면 */
.sub-header{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.sub-header h2{font-size:20px;font-weight:700;color:#f1f5f9}
.sub-back{cursor:pointer;font-size:24px;color:#64748b}
.sub-back:hover{color:#e2e8f0}
.sub-nav{display:flex;align-items:center;gap:12px;margin-left:auto}
.sub-arrow{font-size:13px;color:#60a5fa;cursor:pointer;padding:4px 8px;border-radius:6px;background:#1e293b;font-weight:600}
.sub-arrow:hover{background:#334155;color:#93c5fd}
/* 서브 테이블 */
.stock-table{width:100%;border-collapse:collapse}
.stock-table th{text-align:left;padding:10px 12px;font-size:12px;color:#64748b;border-bottom:1px solid #1e293b;position:sticky;top:0;background:#0a0e1a}
.stock-table td{padding:10px 12px;font-size:13px;border-bottom:1px solid #0f172a}
.stock-table tr:hover td{background:#111827}
.sn{font-weight:600;color:#e2e8f0}
.sc{color:#64748b;font-size:11px}
.sd{color:#64748b;font-size:11px;margin-top:2px}
.st-tags{display:flex;gap:3px;flex-wrap:wrap;margin-top:3px}
.st-tag{font-size:10px;background:#1e3a5f;color:#60a5fa;padding:1px 6px;border-radius:8px}
.price{text-align:right}
.rate{text-align:right;font-weight:700}
.rate.up{color:#ef4444}
.rate.down{color:#3b82f6}
.rate.flat{color:#64748b}
.tv{text-align:right;color:#94a3b8;font-size:12px}
.rk-badge{display:inline-block;width:20px;height:20px;border-radius:5px;text-align:center;line-height:20px;font-size:10px;font-weight:800;color:#fff;margin-right:6px}
/* 에러 */
.error-msg{background:#450a0a;color:#fca5a5;padding:12px 16px;border-radius:10px;font-size:13px;margin:10px 0}
/* 편집 모달 */
.modal-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);z-index:200;align-items:center;justify-content:center}
.modal-overlay.show{display:flex}
.modal-box{background:#1e293b;border-radius:12px;padding:20px;width:90%;max-width:400px;border:1px solid #334155;position:relative;z-index:210}
.modal-box h3{font-size:16px;color:#f1f5f9;margin-bottom:14px}
.modal-box label{display:block;font-size:12px;color:#94a3b8;margin-bottom:4px;margin-top:10px}
.modal-box input{width:100%;padding:8px 10px;border-radius:8px;border:1px solid #334155;background:#0f172a;color:#e2e8f0;font-size:13px;outline:none}
.modal-box input:focus{border-color:#2563eb}
.modal-btns{display:flex;gap:8px;margin-top:16px;justify-content:flex-end}
.modal-toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#065f46;color:#6ee7b7;padding:10px 20px;border-radius:10px;font-size:13px;font-weight:600;z-index:300;display:none}
.stock-table tr.editable:hover td{cursor:pointer;background:#1e293b}
@media(max-width:600px){
.theme-grid{grid-template-columns:1fr}
.header h1{font-size:15px}
}
</style>
</head>
<body>
<div class="header">
<h1>📊 주식 테마 대시보드</h1>
<div class="header-right">
<span class="st off" id="stB">⏸ 대기중</span>
<button class="btn btn-primary btn-small" id="rfB" onclick="fetchAll()">🔄 시세 불러오기</button>
<button class="btn btn-secondary btn-small" onclick="importData()">📥 데이터 가져오기</button>
<button class="btn btn-secondary btn-small" onclick="location.href='themes.html'">📋 종목 관리</button>
</div>
</div>
<div class="status-bar">
<div class="prog-area" id="pgA">
<div class="prog-bar"><div class="prog-fill" id="pgF"></div></div>
<div class="prog-text" id="pgT"></div>
</div>
<div id="errA"></div>
</div>
<div class="container">
<!-- 검색 -->
<div class="search-bar">
<span class="search-icon">🔍</span>
<input type="text" id="searchInput" placeholder="종목명, 태그로 검색" oninput="renderSearch()">
</div>

<!-- 상승 테마 필터 / 거래대금 테마 보기 -->
<div class="filter-bar">
<button class="btn btn-small" id="topToggleBtn" onclick="toggleTopOnly()"></button>
<button class="btn btn-small" id="tvToggleBtn" onclick="toggleTVMode()"></button>
<button class="btn btn-small" id="surgeToggleBtn" onclick="toggleSurgeMode()"></button>
<span class="filter-info" id="filterInfo"></span>
</div>

<!-- 메인 뷰 -->
<div id="mainView"></div>
<!-- 서브 뷰 -->
<div id="subView" style="display:none"></div>
</div>

<!-- 편집 모달 -->
<div class="modal-overlay" id="editModal">
<div class="modal-box">
<h3 id="editTitle">종목 수정</h3>
<label>종목명</label>
<input type="text" id="editName">
<label>종목코드 (6자리)</label>
<input type="text" id="editCode" maxlength="6">
<label>설명 (선택)</label>
<input type="text" id="editDesc">
<div class="modal-btns">
<button class="btn btn-secondary btn-small" onclick="event.stopPropagation();closeEdit()">취소</button>
<button class="btn btn-primary btn-small" onclick="event.stopPropagation();saveEdit()">저장</button>
</div>
</div>
</div>
<div class="modal-toast" id="editToast"></div>

<script>
// ─── 데이터 ───
const STORAGE_KEY = 'stock-dashboard-data';
const LIVE_KEY = 'stock-live-data'; // 시세 데이터 저장용
const TOP_FILTER_KEY = 'stock-dashboard-top-filter'; // 상승 테마만 보기 상태 저장용
let liveData = {}; // code -> {price, change, rate, up, tradingValue, ...}
let currentView = 'main'; // main | sub
let currentThemeIdx = -1;
let showTopOnly = true; // 기본값: 상승 테마만 보기
let currentMainMode = 'theme'; // theme | tv100 (거래대금 테마 보기)
let showAllThemes = false; // 테마 "더보기" 펼침 상태
const THEME_DISPLAY_LIMIT = 8; // 기본으로 보여줄 테마 개수 (캡처처럼 핵심만)

function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch(e) {}
  return { themes: [], version: 1 };
}

function saveData(data) {
  data.lastUpdated = new Date().toISOString();
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

// 시세 데이터 저장/불러오기
function saveLiveData() {
  try {
    localStorage.setItem(LIVE_KEY, JSON.stringify({
      data: liveData,
      savedAt: new Date().toISOString()
    }));
  } catch(e) {}
}
function loadLiveData() {
  try {
    const raw = localStorage.getItem(LIVE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      liveData = parsed.data || {};
      return parsed.savedAt || null;
    }
  } catch(e) {}
  return null;
}

// 필터 상태 저장/불러오기
function loadTopFilter() {
  try {
    const raw = localStorage.getItem(TOP_FILTER_KEY);
    if (raw !== null) return raw === 'true';
  } catch(e) {}
  return true; // 기본 ON
}
function saveTopFilter() {
  try { localStorage.setItem(TOP_FILTER_KEY, String(showTopOnly)); } catch(e) {}
}

// ─── 포맷 유틸 ───
function fPrice(v) { return v ? v.toLocaleString() + '원' : '-'; }
function fRate(v) { 
  if (v === null || v === undefined) return '-';
  const sign = v > 0 ? '+' : '';
  return sign + v.toFixed(2) + '%';
}
function fTV(v) {
  if (!v) return '-';
  if (v >= 1000000000000) return (v/1000000000000).toFixed(1) + '조';
  if (v >= 100000000) return (v/100000000).toFixed(0) + '억';
  if (v >= 10000) return (v/10000).toFixed(0) + '만';
  return v.toLocaleString();
}

const RC = ['rk1','rk2','rk3','rk4','rk5'];

// ─── 필터 토글 버튼 갱신 ───
function renderTopToggleBtn() {
  const btn = document.getElementById('topToggleBtn');
  // 거래대금 테마 보기 / 급등 종목 보기 모드에서는 "상승 테마만" 필터를 숨김 (의미가 없어서)
  if (currentMainMode !== 'theme') {
    btn.style.display = 'none';
    return;
  }
  btn.style.display = '';
  if (showTopOnly) {
    btn.className = 'btn btn-small btn-toggle';
    btn.textContent = '🔥 상승 테마만 보는 중';
  } else {
    btn.className = 'btn btn-small btn-secondary';
    btn.textContent = '📋 전체 테마 보기';
  }
}

function toggleTopOnly() {
  showTopOnly = !showTopOnly;
  showAllThemes = false;
  saveTopFilter();
  if (currentView === 'main') renderMain();
}

// ─── 거래대금 테마 보기 토글 ───
function renderTVToggleBtn() {
  const btn = document.getElementById('tvToggleBtn');
  if (currentMainMode === 'tv100') {
    btn.className = 'btn btn-small btn-toggle';
    btn.textContent = '📋 테마별 보기로 돌아가기';
  } else {
    btn.className = 'btn btn-small btn-secondary';
    btn.textContent = '💰 거래대금 테마 보기';
  }
}

function toggleTVMode() {
  currentMainMode = currentMainMode === 'tv100' ? 'theme' : 'tv100';
  showAllThemes = false;
  if (currentView === 'main') renderMain();
}

// ─── 급등 종목 보기 (등락률 10%+ & 거래대금 조건 & 대표 테마 자동 판별) ───
function renderSurgeToggleBtn() {
  const btn = document.getElementById('surgeToggleBtn');
  if (currentMainMode === 'surge') {
    btn.className = 'btn btn-small btn-toggle';
    btn.textContent = '📋 테마별 보기로 돌아가기';
  } else {
    btn.className = 'btn btn-small btn-secondary';
    btn.textContent = '🚀 급등 종목 (10%+)';
  }
}

function toggleSurgeMode() {
  currentMainMode = currentMainMode === 'surge' ? 'theme' : 'surge';
  showAllThemes = false;
  if (currentView === 'main') renderMain();
}

// 종목이 여러 테마에 속해있을 때, "이 종목이 진짜 어느 테마 때문에 움직였는지" 추정하는 로직.
// 판단 기준: 소속된 테마들 중, 다른 종목들도 같이 많이 오르고 있는(참여 점수가 높은) 테마를
// "대표 테마"로 본다. 예) 한전기술이 원전+건설 둘 다 속해있어도, 오늘 원전 테마 전체가
// 뜨거우면 원전 쪽에 붙인다. 소속 테마가 전부 조용하면(혼자만 튀면) 별도 그룹으로 뺀다.
const SURGE_MIN_RATE = 10;        // 등락률 10% 이상
const SURGE_MIN_TV = 100000000;   // 거래대금 1억원 이상 (허수 상승 걸러내기)
const SURGE_SOLO_GROUP = '📍 단독 상승 (동반 테마 없음)';

function buildSurgeData(data) {
  // 1) 테마별 "지금 얼마나 뜨거운지" 점수 계산 (대표 테마 판단용)
  const themeStrength = {};
  data.themes.forEach(theme => {
    const rates = theme.stocks
      .map(s => (s.code && liveData[s.code]) ? liveData[s.code].rate : null)
      .filter(r => r !== null && r !== 0);
    const riseCount = rates.filter(r => r > 0).length;
    const riseRatio = rates.length > 0 ? riseCount / rates.length : 0;
    themeStrength[theme.name] = { participationScore: riseCount * riseRatio };
  });

  // 2) 조건(등락률 10%+ & 거래대금 조건) 만족하는 종목 수집 (종목당 한 번만, 소속 테마 목록 기억)
  const stockMap = {};
  data.themes.forEach(theme => {
    theme.stocks.forEach(s => {
      if (!s.code) return;
      const live = liveData[s.code];
      if (!live) return;
      if (live.rate < SURGE_MIN_RATE) return;
      if (!live.tradingValue || live.tradingValue < SURGE_MIN_TV) return;
      if (!stockMap[s.code]) {
        stockMap[s.code] = {
          code: s.code, name: s.name, price: live.price,
          rate: live.rate, tradingValue: live.tradingValue,
          high: live.high || 0, low: live.low || 0,
          foreignNetBuy: live.foreignNetBuy || 0,
          programNetBuy: live.programNetBuy || 0,
          themes: []
        };
      }
      if (!stockMap[s.code].themes.includes(theme.name)) {
        stockMap[s.code].themes.push(theme.name);
      }
    });
  });
  const surgeStocks = Object.values(stockMap);

  // 3) 종목마다 대표 테마 하나만 선택 (참여 점수가 가장 높은 소속 테마)
  const sectorGroups = {};
  surgeStocks.forEach(s => {
    let bestTheme = null, bestScore = 0;
    s.themes.forEach(themeName => {
      const score = (themeStrength[themeName] || { participationScore: 0 }).participationScore;
      if (score > bestScore) { bestScore = score; bestTheme = themeName; }
    });
    const groupKey = bestTheme || SURGE_SOLO_GROUP;
    if (!sectorGroups[groupKey]) sectorGroups[groupKey] = [];
    sectorGroups[groupKey].push(s);
  });

  // 4) 그룹 정렬: 종목 수 많은 순 (단독 상승 그룹은 맨 뒤로) → 그룹 내 등락률 높은 순
  const groupArr = Object.keys(sectorGroups).map(name => {
    const stocks = sectorGroups[name].slice().sort((a, b) => b.rate - a.rate);
    return { name, stocks, count: stocks.length };
  });
  groupArr.sort((a, b) => {
    if (a.name === SURGE_SOLO_GROUP) return 1;
    if (b.name === SURGE_SOLO_GROUP) return -1;
    return b.count - a.count;
  });

  return { surgeStocks, groupArr };
}

function renderSurge(data) {
  const mainView = document.getElementById('mainView');
  const { surgeStocks, groupArr } = buildSurgeData(data);

  if (surgeStocks.length === 0) {
    document.getElementById('filterInfo').textContent = '';
    mainView.innerHTML = `
      <div class="empty">
        <div class="empty-icon">🚀</div>
        <div class="empty-text">
          지금은 등락률 ${SURGE_MIN_RATE}% 이상 + 거래대금 ${fTV(SURGE_MIN_TV)} 이상<br>
          조건을 만족하는 종목이 없어요.<br>
          시세를 다시 불러오거나 조금 뒤에 확인해보세요.
        </div>
      </div>`;
    return;
  }

  const limitedGroups = showAllThemes ? groupArr : groupArr.slice(0, THEME_DISPLAY_LIMIT);
  document.getElementById('filterInfo').textContent =
    `${SURGE_MIN_RATE}%+ 급등 종목 ${surgeStocks.length}개 · ${groupArr.length}개 그룹 중 ${limitedGroups.length}개 표시`;

  let html = '<div class="theme-grid">';
  limitedGroups.forEach(({ name, stocks }) => {

// 더보기 버튼 HTML 생성 (테마별 뷰, 거래대금 뷰 공통)
function renderMoreButton(totalCount) {
  if (totalCount <= THEME_DISPLAY_LIMIT) return '';
  if (showAllThemes) {
    return `<div style="text-align:center;margin-top:16px">
      <button class="btn btn-secondary btn-small" onclick="toggleShowAllThemes()">▲ 접기 (상위 ${THEME_DISPLAY_LIMIT}개만 보기)</button>
    </div>`;
  }
  return `<div style="text-align:center;margin-top:16px">
    <button class="btn btn-secondary btn-small" onclick="toggleShowAllThemes()">▼ 더보기 (${totalCount - THEME_DISPLAY_LIMIT}개 더 있음)</button>
  </div>`;
}

// 등록된 종목들 중 거래대금 상위 100개를 뽑아서 테마별로 묶는다
// (같은 종목이 여러 테마에 속해있으면, 관련된 테마마다 다 표시됨)
function buildTV100Data(data) {
  const stockMap = {}; // code -> {code,name,price,rate,tradingValue,themes:[]}

  data.themes.forEach(theme => {
    theme.stocks.forEach(s => {
      if (!s.code) return;
      const live = liveData[s.code];
      if (!live || !live.tradingValue) return;
      if (!stockMap[s.code]) {
        stockMap[s.code] = {
          code: s.code,
          name: s.name,
          price: live.price,
          rate: live.rate,
          tradingValue: live.tradingValue,
          high: live.high || 0,
          low: live.low || 0,
          themes: []
        };
      }
      if (!stockMap[s.code].themes.includes(theme.name)) {
        stockMap[s.code].themes.push(theme.name);
      }
    });
  });

  const allStocks = Object.values(stockMap).sort((a, b) => b.tradingValue - a.tradingValue);
  const top100 = allStocks.slice(0, 100);
  top100.forEach((s, i) => { s.tvRank = i + 1; });

  // 테마별로 묶기
  const themeGroups = {};
  top100.forEach(s => {
    s.themes.forEach(themeName => {
      if (!themeGroups[themeName]) themeGroups[themeName] = [];
      themeGroups[themeName].push(s);
    });
  });

  // 테마 정렬: TOP100 안에 몇 종목이나 들어있는지(count) 순 → 동점이면 최고 거래대금 순
  const groupArr = Object.keys(themeGroups).map(name => {
    const stocks = themeGroups[name].slice().sort((a, b) => a.tvRank - b.tvRank);
    return { name, stocks, maxTV: stocks[0].tradingValue, count: stocks.length };
  });
  groupArr.sort((a, b) => {
    if (b.count !== a.count) return b.count - a.count;
    return b.maxTV - a.maxTV;
  });

  return { top100, groupArr };
}

// 거래대금 테마 보기 렌더

  const mainView = document.getElementById('mainView');

// ─── 메인 렌더 ───
function renderMain() {
  const data = loadData();
  const mainView = document.getElementById('mainView');
  const subView = document.getElementById('subView');
  mainView.style.display = 'block';
  subView.style.display = 'none';
  currentView = 'main';

  renderTopToggleBtn();
  renderTVToggleBtn();
  renderSurgeToggleBtn();

  if (data.themes.length === 0) {
    document.getElementById('filterInfo').textContent = '';
    mainView.innerHTML = `
      <div class="empty">
        <div class="empty-icon">📁</div>
        <div class="empty-text">
          아직 등록된 테마가 없어요!<br>
          "종목 관리" 페이지에서 테마와 종목을 추가하면<br>
          여기에 대시보드가 나타납니다.
        </div>
        <button class="btn btn-primary" onclick="location.href='themes.html'" style="margin-top:16px">📋 종목 관리로 이동</button>
      </div>`;
    return;
  }

  // 거래대금 테마 보기 / 급등 종목 보기 모드면 별도 렌더링으로 분기
  if (currentMainMode === 'tv100') {
    renderTV100(data);
    return;
  }
  if (currentMainMode === 'surge') {
    renderSurge(data);
    return;
  }

  // 테마별 데이터 계산 (실시간 데이터 결합)
  const themeCards = data.themes.map((theme, ti) => {
    const stocks = theme.stocks.map(s => {
      const live = s.code ? liveData[s.code] : null;
      return {
        ...s,
        price: live ? live.price : 0,
        change: live ? live.change : 0,
        rate: live ? live.rate : 0,
        up: live ? live.up : null,
        tradingValue: live ? live.tradingValue : 0,
        high: live ? live.high : 0,
        low: live ? live.low : 0
      };
    });

    // 상위 5종목: 등락률 상위 3개 + 거래대금 상위 2개를 섞어서 보여줌
    // (등락률로만 뽑으면 삼성전자 같은 대형주가 순위에서 밀려 안 보이는 문제가 있어서,
    //  거래대금 큰 종목도 같이 노출되도록 보완함)
    const RATE_PICK_COUNT = 3, TV_PICK_COUNT = 2;
    const byRate = stocks.filter(s => s.rate > 0).sort((a, b) => b.rate - a.rate);
    const byTV = stocks.filter(s => s.tradingValue > 0).sort((a, b) => b.tradingValue - a.tradingValue);

    const top5 = [];
    const usedKeys = new Set();
    const addPick = s => { const k = s.code || s.name; if (!usedKeys.has(k)) { top5.push(s); usedKeys.add(k); } };

    byRate.slice(0, RATE_PICK_COUNT).forEach(addPick);
    byTV.forEach(s => { if (top5.length < 5) addPick(s); });
    // 거래대금 데이터가 부족해 5개를 못 채우면 등락률 순으로 마저 채움
    byRate.forEach(s => { if (top5.length < 5) addPick(s); });

    // 거래대금 대장주
    const tvKing = stocks.filter(s => s.tradingValue > 0)
      .sort((a, b) => b.tradingValue - a.tradingValue)[0] || null;

    // 평균 등락률 (테마 강도)
    const ratesWithData = stocks.filter(s => s.rate !== 0);
    const avgRate = ratesWithData.length > 0
      ? ratesWithData.reduce((s, st) => s + st.rate, 0) / ratesWithData.length
      : 0;

    // 1위 종목 상승률 (테마 정렬 기준)
    const topRate = top5.length > 0 ? top5[0].rate : -Infinity;

    // 상승 종목 수 / 시세 확인된 종목 수
    const riseCount = stocks.filter(s => s.rate > 0).length;
    const dataCount = ratesWithData.length;
    const riseRatio = dataCount > 0 ? riseCount / dataCount : 0;

    // 테마 전체 거래대금 합계 (돈이 얼마나 몰렸는지)
    const totalTV = stocks.reduce((sum, s) => sum + (s.tradingValue || 0), 0);

    // 참여 점수 = 상승 종목 수 × 상승 비율
    // (종목 2~3개짜리 소형 테마가 등락률만 높게 튀는 것보다,
    //  많은 종목이 함께 동반 상승하는 "진짜 테마"를 우선하기 위한 지표)
    const participationScore = riseCount * riseRatio;

    return { theme, ti, stocks, top5, tvKing, avgRate, topRate, riseCount, dataCount, riseRatio, totalTV, participationScore };
  });

  // 참여 점수(상승종목수 × 상승비율) 순 정렬
  // - 종목 몇 개 안 되는 소형 테마가 등락률만 높은 것보다,
  //   많은 종목이 함께 동반 상승하는 "규모 있는 진짜 테마"를 위로 올림
  // - 동점일 경우 1위 종목 상승률로 2차 정렬
  themeCards.sort((a, b) => {
    if (b.participationScore !== a.participationScore) {
      return b.participationScore - a.participationScore;
    }
    return b.topRate - a.topRate;
  });

  const totalCount = themeCards.length;
  let displayCards = themeCards;

  if (showTopOnly) {
    // 1위 종목이 상승 중인(topRate > 0) 테마만
    displayCards = themeCards.filter(c => c.topRate > 0);
  }

  const limitedCards = showAllThemes ? displayCards : displayCards.slice(0, THEME_DISPLAY_LIMIT);

  if (showTopOnly) {
    document.getElementById('filterInfo').textContent =
      displayCards.length > 0
        ? `상승 테마 ${displayCards.length}개 중 ${limitedCards.length}개 표시 / 전체 ${totalCount}개`
        : `지금은 상승 중인 테마가 없어요 (전체 ${totalCount}개)`;
  } else {
    document.getElementById('filterInfo').textContent = `전체 테마 ${totalCount}개 중 ${limitedCards.length}개 표시`;
  }

  if (displayCards.length === 0) {
    mainView.innerHTML = `
      <div class="empty">
        <div class="empty-icon">😴</div>
        <div class="empty-text">
          지금은 상승 중인 테마가 없어요.<br>
          시세를 다시 불러오거나, "전체 테마 보기"를 눌러보세요.
        </div>
      </div>`;
    return;
  }

  let html = '<div class="theme-grid">';
  limitedCards.forEach(({ theme, ti, top5, tvKing, avgRate, riseCount, dataCount, totalTV }, idx) => {
    const rank = idx + 1;
    const medalClass = rank === 1 ? 'medal1' : rank === 2 ? 'medal2' : rank === 3 ? 'medal3' : 'plain';
    const medalLabel = rank === 1 ? '🥇' : rank === 2 ? '🥈' : rank === 3 ? '🥉' : rank;

    // 카드 강도에 따른 은은한 배경 틴트 (평균 등락률 기준)
    const intensity = Math.min(Math.abs(avgRate) / 5, 1); // 5% 이상이면 최대 강도
    let tint = 'transparent';
    if (avgRate > 0.05) tint = `rgba(239,68,68,${(0.04 + intensity * 0.12).toFixed(2)})`;
    else if (avgRate < -0.05) tint = `rgba(59,130,246,${(0.04 + intensity * 0.12).toFixed(2)})`;

    const rateClass = avgRate > 0.05 ? 'up' : avgRate < -0.05 ? 'down' : 'flat';
    const riseRatioText = dataCount > 0 ? `${riseCount}/${dataCount}` : '-';

    html += `<div class="tc" style="background-image:linear-gradient(${tint},${tint}),linear-gradient(#111827,#111827)" onclick="openSub(${ti})">
      <div class="tc-head">
        <div class="tc-head-left">
          <span class="tc-rank ${medalClass}">${medalLabel}</span>
          <span class="tc-name">${theme.name}</span>
        </div>
      </div>
      <div class="tc-stats">
        <div class="tc-stat">
          <span class="tc-stat-label">평균 등락률</span>
          <span class="tc-stat-value ${rateClass}">${fRate(avgRate)}</span>
        </div>
        <div class="tc-stat">
          <span class="tc-stat-label">상승 종목</span>
          <span class="tc-stat-value ${rateClass}">${riseRatioText}</span>
        </div>
        <div class="tc-stat">
          <span class="tc-stat-label">총 거래대금</span>
          <span class="tc-stat-value">${totalTV ? fTV(totalTV) : '-'}</span>
        </div>
      </div>
      <div class="tc-list">`;
    if (top5.length > 0) {
      top5.forEach((s, j) => {
        const pickRateClass = s.rate > 0 ? 'up' : s.rate < 0 ? 'down' : 'flat';
        const pickRateText = s.rate > 0 ? '+' + s.rate.toFixed(2) + '%' : s.rate.toFixed(2) + '%';
        html += `<div class="tc-row">
          <div class="tc-rk ${RC[j]}">${j+1}</div>
          <span class="tc-sn">${s.name}</span>
          <span class="tc-sr ${pickRateClass}">${pickRateText}</span>
          <span class="tc-tv">${s.price ? fTV(s.tradingValue) : '-'}</span>
        </div>`;
      });
    } else {
      html += `<div class="tc-empty">시세를 불러오면 상승 TOP5가 표시됩니다</div>`;
    }
    if (tvKing) {
      html += `<div class="tc-crown">👑 거래대금 <span class="tcn">${tvKing.name}</span> <span class="tcv">${fTV(tvKing.tradingValue)}</span></div>`;
    }
    html += `</div>
      <div style="text-align:right;margin-top:8px">
        <span style="color:#334155;font-size:12px">${theme.stocks.length}종목 →</span>
      </div>
    </div>`;
  });
  html += '</div>';
  html += renderMoreButton(displayCards.length);
  mainView.innerHTML = html;
}

function openSub(ti) {
  currentView = 'sub';
  currentThemeIdx = ti;
  const data = loadData();
  const theme = data.themes[ti];
  const mainView = document.getElementById('mainView');
  const subView = document.getElementById('subView');
  mainView.style.display = 'none';
  subView.style.display = 'block';

  // 종목에 실시간 데이터 결합
  const stocks = theme.stocks.map(s => {
    const live = s.code ? liveData[s.code] : null;
    return {
      ...s,
      price: live ? live.price : 0,
      change: live ? live.change : 0,
      rate: live ? live.rate : 0,
      up: live ? live.up : null,
      tradingValue: live ? live.tradingValue : 0
    };
  });

  // 등락률 순 정렬
  stocks.sort((a, b) => b.rate - a.rate);

  const data_all = loadData();
  const totalThemes = data_all.themes.length;
  const prevIdx = ti > 0 ? ti - 1 : totalThemes - 1;
  const nextIdx = ti < totalThemes - 1 ? ti + 1 : 0;

  let html = `
    <div class="sub-header">
      <span class="sub-back" onclick="renderMain()">← </span>
      <h2>${theme.name}</h2>
      <span style="color:#64748b;font-size:14px">${stocks.length}종목</span>
      <div class="sub-nav">
        <span class="sub-arrow" onclick="openSub(${prevIdx})" title="${data_all.themes[prevIdx].name}">◀ 이전</span>
        <span style="color:#475569;font-size:12px">${ti+1} / ${totalThemes}</span>
        <span class="sub-arrow" onclick="openSub(${nextIdx})" title="${data_all.themes[nextIdx].name}">다음 ▶</span>
      </div>
    </div>
    <div style="overflow-x:auto">

      <thead>
        <tr>
          <th style="width:30px">#</th>
          <th>종목</th>
          <th class="price">현재가</th>
          <th class="rate">등락률</th>
          <th class="tv">거래대금</th>
        </tr>
      </thead>
      <tbody>`;

  // 원본 데이터에서 이 종목의 실제 인덱스를 찾기 위해 매핑
  const origStocks = theme.stocks;
  stocks.forEach((s, i) => {
    const rateClass = s.rate > 0 ? 'up' : s.rate < 0 ? 'down' : 'flat';
    const rankBg = i < 5 ? RC[i] : '';
    // 원본 인덱스 찾기 (정렬 전 위치)
    const origIdx = origStocks.findIndex(os => os.name === s.name && os.code === s.code);
    html += `<tr class="editable" onclick="openEdit(${ti},${origIdx},'${s.name.replace(/'/g,"\\'")}','${s.code||''}','${(s.desc||'').replace(/'/g,"\\'")}')">
      <td>${i < 5 ? `<span class="rk-badge ${rankBg}">${i+1}</span>` : `<span style="color:#475569">${i+1}</span>`}</td>
      <td>
        <div class="sn">${s.name} ${s.code ? `<span class="sc">${s.code}</span>` : ''} <span style="color:#334155;font-size:10px">✏️</span></div>
        ${s.desc ? `<div class="sd">${s.desc}</div>` : ''}
        ${s.tags && s.tags.length ? `<div class="st-tags">${s.tags.map(t => `<span class="st-tag">#${t}</span>`).join('')}</div>` : ''}
      </td>
      <td class="price">${s.price ? fPrice(s.price) : '-'}</td>
      <td class="rate ${rateClass}">${s.price ? fRate(s.rate) : '-'}</td>
      <td class="tv">${s.price ? fTV(s.tradingValue) : '-'}</td>
    </tr>`;
  });
  html += `</tbody></table></div>`;
  subView.innerHTML = html;
}

// ─── 검색 ───
function renderSearch() {
  const query = document.getElementById('searchInput').value.toLowerCase().trim();
  if (!query) {
    if (currentView === 'main') renderMain();
    return;
  }
  const data = loadData();
  const results = [];
  data.themes.forEach(theme => {
    theme.stocks.forEach(s => {
      const matchName = s.name.toLowerCase().includes(query);
      const matchCode = s.code && s.code.includes(query);
      const matchTag = s.tags && s.tags.some(t => t.toLowerCase().includes(query));
      if (matchName || matchCode || matchTag) {
        const live = s.code ? liveData[s.code] : null;
        results.push({
          ...s, theme: theme.name,
          price: live ? live.price : 0,
          rate: live ? live.rate : 0,
          up: live ? live.up : null,
          tradingValue: live ? live.tradingValue : 0
        });
      }
    });
  });

  const mainView = document.getElementById('mainView');
  document.getElementById('subView').style.display = 'none';
  mainView.style.display = 'block';

  if (results.length === 0) {
    mainView.innerHTML = `<div class="empty"><div class="empty-icon">🔍</div><div class="empty-text">"${query}" 검색 결과가 없습니다</div></div>`;
    return;
  }

  let html = `<div style="margin-bottom:12px;color:#94a3b8;font-size:13px">"${query}" 검색결과 ${results.length}건</div>
  <table class="stock-table"><thead><tr>
    <th>종목</th><th>테마</th><th class="price">현재가</th><th class="rate">등락률</th>
  </tr></thead><tbody>`;
  results.forEach(s => {
    const rateClass = s.rate > 0 ? 'up' : s.rate < 0 ? 'down' : 'flat';
    html += `<tr>
      <td><span class="sn">${s.name}</span> ${s.code ? `<span class="sc">${s.code}</span>` : ''}</td>
      <td><span style="color:#60a5fa;font-size:12px">#${s.theme}</span></td>
      <td class="price">${s.price ? fPrice(s.price) : '-'}</td>
      <td class="rate ${rateClass}">${s.price ? fRate(s.rate) : '-'}</td>
    </tr>`;
  });
  html += '</tbody></table>';
  mainView.innerHTML = html;
}

// ─── 시세 불러오기 (한국투자증권 API) ───
async function fetchAll() {
  const data = loadData();
  const btn = document.getElementById('rfB');
  const bg = document.getElementById('stB');
  const pa = document.getElementById('pgA');
  const pf = document.getElementById('pgF');
  const pt = document.getElementById('pgT');

  // 모든 종목코드 수집 (중복 제거)
  const allCodes = new Set();
  data.themes.forEach(t => t.stocks.forEach(s => { if (s.code) allCodes.add(s.code); }));

  if (allCodes.size === 0) {
    document.getElementById('errA').innerHTML = '<div class="error-msg">⚠️ 종목코드가 입력된 종목이 없어요. "종목 관리"에서 6자리 종목코드를 넣어주세요.</div>';
    return;
  }

  btn.disabled = true;
  btn.textContent = '⏳ 토큰 준비 중...';
  bg.className = 'st ld';
  bg.textContent = '⏳ 수신중';
  pa.style.display = 'block';
  document.getElementById('errA').innerHTML = '';

  // 토큰을 딱 1번만 미리 받아온 다음, 모든 요청에 재사용 (동시 요청으로 인한 중복 토큰 발급 방지)
  let sharedToken = null;
  try {
    const tokenRes = await fetch('/api/stock?action=token');
    const tokenData = await tokenRes.json();
    if (tokenData.success) sharedToken = tokenData.token;
  } catch (e) {}

  btn.textContent = '⏳ 불러오는 중...';

  let done = 0, ok = 0;
  const total = allCodes.size;
  const codeList = Array.from(allCodes);
  const BATCH_SIZE = 5; // 한 번에 5개씩만 동시 요청 (API 제재 방지)
  const BATCH_DELAY = 250; // 배치 사이 대기 시간(ms)
  const failedCodes = new Set();
  const tokenParam = sharedToken ? `&token=${sharedToken}` : '';

  async function fetchOne(code, isRetry) {
    try {
      const res = await fetch('/api/stock?code=' + code + tokenParam);
      const d = await res.json();
      if (d.success) {
        liveData[code] = d;
        ok++;
        failedCodes.delete(code);
      } else {
        failedCodes.add(code);
      }
    } catch(e) {
      failedCodes.add(code);
    }
    if (!isRetry) {
      done++;
      pf.style.width = Math.round(done / total * 100) + '%';
      pt.textContent = `${done}/${total} 종목 (성공:${ok})`;
    }
  }

  for (let i = 0; i < codeList.length; i += BATCH_SIZE) {
    const batch = codeList.slice(i, i + BATCH_SIZE);
    await Promise.all(batch.map(c => fetchOne(c, false)));
    await new Promise(r => setTimeout(r, BATCH_DELAY));
  }

  // 실패한 종목 자동 재시도 (최대 2회)
  for (let retryRound = 1; retryRound <= 2 && failedCodes.size > 0; retryRound++) {
    const retryList = Array.from(failedCodes);
    pt.textContent = `재시도 중... (${retryList.length}개 종목, ${retryRound}차)`;
    for (let i = 0; i < retryList.length; i += BATCH_SIZE) {
      const batch = retryList.slice(i, i + BATCH_SIZE);
      await Promise.all(batch.map(c => fetchOne(c, true)));
      await new Promise(r => setTimeout(r, BATCH_DELAY));
    }
    pt.textContent = `${total}/${total} 종목 (성공:${ok}, 재시도 ${retryRound}차 완료)`;
  }

  // 렌더 갱신
  if (currentView === 'main') renderMain();
  else if (currentView === 'sub') openSub(currentThemeIdx);

  // 시세 데이터를 localStorage에 저장 (껐다 켜도 유지)
  saveLiveData();

  const ts = new Date().toLocaleString('ko-KR', { hour:'2-digit', minute:'2-digit', second:'2-digit' });
  if (ok === 0) {
    document.getElementById('errA').innerHTML = '<div class="error-msg">❌ API 연결 실패. Vercel 환경변수(KIS_APPKEY, KIS_APPSECRET)를 확인하세요.</div>';
    bg.className = 'st off';
    bg.textContent = '❌ 실패';
  } else {
    bg.className = 'st on';
    bg.textContent = `🟢 실시간 · ${ts}`;
    if (failedCodes.size > 0) {
      document.getElementById('errA').innerHTML = `<div class="error-msg">⚠️ ${failedCodes.size}개 종목은 2번 재시도해도 실패했어요. "🔄 시세 불러오기"를 한 번 더 눌러보세요.</div>`;
    }
  }
  btn.disabled = false;
  btn.textContent = '🔄 시세 불러오기';
  setTimeout(() => { pa.style.display = 'none'; }, 2000);
}

// ─── 종목 편집 (대시보드에서 직접 수정) ───
let editThemeIdx = -1;
let editStockIdx = -1;
let editOldName = '';
let editOldCode = '';

function openEdit(ti, si, name, code, desc) {
  editThemeIdx = ti;
  editStockIdx = si;
  editOldName = name;
  editOldCode = code;
  document.getElementById('editTitle').textContent = `${name} 수정`;
  document.getElementById('editName').value = name;
  document.getElementById('editCode').value = code;
  document.getElementById('editDesc').value = desc;
  document.getElementById('editModal').classList.add('show');
}

function closeEdit() {
  document.getElementById('editModal').classList.remove('show');
}

function saveEdit() {
  const newName = document.getElementById('editName').value.trim();
  const newCode = document.getElementById('editCode').value.trim();
  const newDesc = document.getElementById('editDesc').value.trim();
  if (!newName) return;

  const data = loadData();
  // 현재 테마의 해당 종목 수정
  if (data.themes[editThemeIdx] && data.themes[editThemeIdx].stocks[editStockIdx]) {
    data.themes[editThemeIdx].stocks[editStockIdx].name = newName;
    data.themes[editThemeIdx].stocks[editStockIdx].code = newCode;
    data.themes[editThemeIdx].stocks[editStockIdx].desc = newDesc;
  }

  // 다른 테마에 같은 종목 동기화
  let syncCount = 0;
  data.themes.forEach((theme, tIdx) => {
    if (tIdx === editThemeIdx) return;
    theme.stocks.forEach((s, sIdx) => {
      const matchByName = editOldName && s.name === editOldName;
      const matchByCode = editOldCode && s.code === editOldCode;
      if (matchByName || matchByCode) {
        data.themes[tIdx].stocks[sIdx].name = newName;
        data.themes[tIdx].stocks[sIdx].code = newCode;
        data.themes[tIdx].stocks[sIdx].desc = newDesc;
        syncCount++;
      }
    });
  });

  saveData(data);
  closeEdit();
  openSub(editThemeIdx);

  const toast = document.getElementById('editToast');
  toast.textContent = syncCount > 0
    ? `"${newName}" 수정됨 (다른 테마 ${syncCount}곳 동기화)`
    : `"${newName}" 수정됨`;
  toast.style.display = 'block';
  setTimeout(() => { toast.style.display = 'none'; }, 2500);
}

// 모달 밖 클릭하면 닫기 (모달 박스 안 클릭은 무시)
document.getElementById('editModal').addEventListener('click', function(e) {
  if (e.target === this) closeEdit();
});
document.querySelector('.modal-box').addEventListener('click', function(e) {
  e.stopPropagation();
});

// ─── 데이터 가져오기 (서버에서 최신 데이터 자동 로드) ───
async function importData() {
  const toast = document.getElementById('editToast');
  try {
    toast.textContent = '📥 데이터 가져오는 중...';
    toast.style.display = 'block';
    const res = await fetch('/data.json?' + Date.now());
    if (!res.ok) throw new Error('파일을 찾을 수 없습니다');
    const data = await res.json();
    data.lastUpdated = new Date().toISOString();
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    toast.textContent = '✅ 테마 ' + data.themes.length + '개 데이터 가져오기 완료!';
    setTimeout(() => { toast.style.display = 'none'; location.reload(); }, 1500);
  } catch (e) {
    toast.style.background = '#450a0a';
    toast.style.color = '#fca5a5';
    toast.textContent = '❌ 데이터 가져오기 실패: ' + e.message;
    setTimeout(() => { toast.style.display = 'none'; toast.style.background = '#065f46'; toast.style.color = '#6ee7b7'; }, 3000);
  }
}

}
renderMain();
</script>
