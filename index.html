<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>테마별 실시간 대장주 대시보드</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/pretendard/1.3.9/static/pretendard.min.css" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Pretendard',-apple-system,sans-serif;background:#0f1117;color:#e2e4e9;line-height:1.6}
.header{background:linear-gradient(135deg,#131620,#1a1f2e);border-bottom:1px solid #2a2f3e;padding:20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
.header h1{font-size:20px;font-weight:800;color:#fff}
.header-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.status{font-size:12px;padding:5px 12px;border-radius:16px;font-weight:600}
.status.live{background:#22c55e20;color:#4ade80}.status.off{background:#ef444420;color:#f87171}.status.loading{background:#f59e0b20;color:#fbbf24}
.btn{padding:8px 16px;border-radius:10px;border:1px solid #2a2f3e;background:#1a1f2e;color:#e2e4e9;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s;font-family:inherit}
.btn:hover{background:#252b3d}.btn.primary{background:#3b82f6;border-color:#3b82f6;color:#fff}.btn:disabled{opacity:.5;cursor:not-allowed}
.progress-bar{width:100%;max-width:960px;margin:0 auto;padding:0 16px}
.progress-track{height:4px;background:#1e2333;border-radius:2px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,#3b82f6,#22c55e);border-radius:2px;transition:width .3s;width:0%}
.progress-text{font-size:11px;color:#6b7280;text-align:center;padding:6px 0}
.nav-wrap{position:sticky;top:0;z-index:100;background:#131620ee;backdrop-filter:blur(12px);border-bottom:1px solid #1e2333;padding:10px 16px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.nav-wrap::-webkit-scrollbar{display:none}
.nav{display:flex;gap:6px;min-width:max-content}
.nav a{display:inline-block;padding:6px 12px;border-radius:20px;font-size:12px;font-weight:600;color:#8b92a5;background:#1a1f2e;text-decoration:none;white-space:nowrap;transition:all .2s;border:1px solid transparent}
.nav a:hover{color:#fff;background:#252b3d;border-color:#3b4260}
.container{max-width:960px;margin:0 auto;padding:16px 16px 80px}

/* 대장주 요약 카드 */
.summary-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px;margin-bottom:24px}
.summary-card{background:#161a26;border:1px solid #1e2333;border-radius:12px;padding:14px 16px;cursor:pointer;transition:all .2s}
.summary-card:hover{border-color:#3b4260;background:#1a1f2e}
.summary-theme{font-size:12px;color:#6b7280;font-weight:600;margin-bottom:8px}
.summary-row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px}
.summary-label{font-size:11px;display:flex;align-items:center;gap:4px}
.summary-name{font-size:13px;font-weight:700;color:#e2e4e9}
.summary-rate{font-size:13px;font-weight:700}
.summary-tv{font-size:11px;color:#6b7280}

/* 섹터 */
.sector{margin-bottom:24px;border-radius:14px;background:#161a26;border:1px solid #1e2333;overflow:hidden}
.sector-head{display:flex;align-items:center;gap:10px;padding:14px 16px 10px;border-bottom:1px solid #1e2333}
.sector-icon{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.sector-head h2{font-size:16px;font-weight:800;color:#fff}
.sector-head .count{margin-left:auto;font-size:11px;color:#6b7280;background:#1e2333;padding:3px 10px;border-radius:12px}

/* 대장주 하이라이트 */
.leader-bar{display:flex;gap:8px;padding:10px 16px;background:#0f1117;border-bottom:1px solid #1e2333;flex-wrap:wrap}
.leader-chip{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:8px;font-size:12px;font-weight:600}
.leader-chip.fire{background:#ef444415;border:1px solid #ef444430;color:#f87171}
.leader-chip.crown{background:#f59e0b15;border:1px solid #f59e0b30;color:#fbbf24}
.leader-chip .lc-name{color:#e2e4e9;font-weight:700}
.leader-chip .lc-val{font-weight:700}

table{width:100%;border-collapse:collapse;font-size:13px}
thead th{padding:8px 12px;font-weight:600;color:#6b7280;text-align:left;font-size:11px;background:#131620}
thead th:nth-child(2),thead th:nth-child(3),thead th:nth-child(4),thead th:nth-child(5){text-align:right}
tbody tr{border-top:1px solid #1a1e2a;transition:background .15s}
tbody tr:hover{background:#1a1f2e}
tbody tr.rank-1{background:#ef444408}
tbody tr.rank-crown{background:#f59e0b08}
td{padding:8px 12px;vertical-align:top}
td:nth-child(2),td:nth-child(3),td:nth-child(4),td:nth-child(5){text-align:right;font-variant-numeric:tabular-nums}
.sn{font-weight:700;color:#e2e4e9}
.sr{display:block;font-size:10px;color:#6b7280;margin-top:1px;line-height:1.3}
.price{font-weight:600;color:#d1d5db}
.up{color:#ef4444}.down{color:#3b82f6}.flat{color:#6b7280}
.tv{font-size:12px;color:#9ca3af}
.badge{display:inline-block;font-size:9px;font-weight:700;padding:1px 6px;border-radius:4px;margin-left:4px;vertical-align:middle}
.badge-fire{background:#ef444420;color:#f87171}
.badge-crown{background:#f59e0b20;color:#fbbf24}
.badge-leader{background:#6366f120;color:#818cf8}
.updated-at{text-align:center;padding:10px;font-size:11px;color:#4b5563}
.settings-bar{background:#1a1f2e;border:1px solid #2a2f3e;border-radius:10px;padding:10px 16px;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.settings-bar span{font-size:13px;color:#9ca3af}
.settings-bar select{background:#0f1117;border:1px solid #2a2f3e;color:#e2e4e9;padding:6px 10px;border-radius:8px;font-size:13px;font-family:inherit}
.error-msg{background:#ef444420;border:1px solid #ef444440;border-radius:10px;padding:16px;margin:16px 0;color:#f87171;font-size:13px;text-align:center}
.section-title{font-size:16px;font-weight:800;color:#fff;margin:20px 0 12px;padding-left:4px}

.bg-semi{background:#6366f120}.bg-mlcc{background:#8b5cf620}.bg-ai{background:#06b6d420}.bg-robot{background:#10b98120}
.bg-power{background:#f59e0b20}.bg-nuke{background:#ef444420}.bg-solar{background:#f9731620}.bg-batt{background:#22c55e20}
.bg-oil{background:#78716c20}.bg-space{background:#818cf820}.bg-optic{background:#a78bfa20}.bg-coin{background:#fbbf2420}
.bg-fin{background:#14b8a620}.bg-def{background:#64748b20}.bg-ship{background:#0ea5e920}.bg-bio{background:#a3e63520}
.bg-beauty{background:#f472b620}.bg-nk{background:#fb923c20}

@media(max-width:600px){
.header h1{font-size:17px}table{font-size:11px}td,thead th{padding:6px 8px}.sr{font-size:9px}.sector-head h2{font-size:14px}
.summary-grid{grid-template-columns:1fr}
}
</style>
</head>

<div class="header">
  <h1>📊 테마별 대장주 대시보드</h1>
  <div class="header-right">

  </div>
</div>
<div class="progress-bar" id="progressArea" style="display:none">

  <div class="progress-text" id="progressText"></div>
</div>
<div class="nav-wrap"><div class="nav" id="navBar"></div></div>

<div class="container">

let refreshTimer=null,totalStocks=0,isLive=false;

function formatTV(v){
  if(!v||v===0)return '-';
  if(v>=1e12)return (v/1e12).toFixed(1)+'조';
  if(v>=1e8)return (v/1e8).toFixed(0)+'억';
  if(v>=1e4)return (v/1e4).toFixed(0)+'만';
  return v.toLocaleString();
}

function getLeaders(theme){
  const stocks=theme.stocks.filter(s=>s.r!==undefined);
  const byRate=[...stocks].sort((a,b)=>Math.abs(b.r)-Math.abs(a.r));
  const byTV=[...stocks].sort((a,b)=>(b.tv||0)-(a.tv||0));
  return {
    rateTop: byRate.length>0?byRate[0]:null,
    tvTop: byTV.length>0&&byTV[0].tv>0?byTV[0]:null
  };
}

function renderSummary(){
  let html='';
  THEMES.forEach(t=>{
    const {rateTop,tvTop}=getLeaders(t);
    const rn=rateTop?rateTop.name:'-';
    const rr=rateTop?(rateTop.u===true||rateTop.u===1?'+':rateTop.u===false||rateTop.u===0?'-':'')+Math.abs(rateTop.r).toFixed(2)+'%':'';
    const rc=rateTop?(rateTop.u===true||rateTop.u===1?'up':rateTop.u===false||rateTop.u===0?'down':'flat'):'flat';
    const tn=tvTop?tvTop.name:'-';
    const ttv=tvTop?formatTV(tvTop.tv):'-';
    html+=`<div class="summary-card" onclick="document.getElementById('${t.id}').scrollIntoView({behavior:'smooth',block:'start'})">
      <div class="summary-theme">${t.icon} ${t.name}</div>
      <div class="summary-row">
        <span class="summary-label">🔥 등락률 1등</span>
        <span class="summary-name">${rn}</span>
        <span class="summary-rate ${rc}">${rr}</span>
      </div>
      <div class="summary-row">
        <span class="summary-label">👑 거래대금</span>
        <span class="summary-name">${tn}</span>
        <span class="summary-tv">${ttv}</span>
      </div>
    </div>`;
  });
  document.getElementById('summaryGrid').innerHTML=html;
}

function renderDashboard(){
  THEMES.forEach(t=>totalStocks+=t.stocks.length);
  document.getElementById('navBar').innerHTML=THEMES.map(t=>`<a href="#${t.id}">${t.icon} ${t.name}</a>`).join('');
  let html='';
  THEMES.forEach(t=>{
    const {rateTop,tvTop}=getLeaders(t);
    html+=`<div class="sector" id="${t.id}"><div class="sector-head"><div class="sector-icon ${t.bg}">${t.icon}</div><h2>${t.name}</h2><span class="count">${t.stocks.length}종목</span></div>`;
    html+=`<div class="leader-bar" id="lb-${t.id}">`;
    if(rateTop)html+=`<div class="leader-chip fire">🔥 등락률 1등 <span class="lc-name">${rateTop.name}</span> <span class="lc-val ${rateTop.u===true||rateTop.u===1?'up':'down'}">${rateTop.u===true||rateTop.u===1?'+':'-'}${Math.abs(rateTop.r).toFixed(2)}%</span></div>`;
    if(tvTop)html+=`<div class="leader-chip crown">👑 거래대금 <span class="lc-name">${tvTop.name}</span> <span class="lc-val">${formatTV(tvTop.tv)}</span></div>`;
    html+=`</div>`;
    html+=`<table><thead><tr><th>종목명</th><th>현재가</th><th>전일비</th><th>등락률</th><th>거래대금</th></tr></thead><tbody id="tb-${t.id}">`;
    const sorted=[...t.stocks].sort((a,b)=>Math.abs(b.r)-Math.abs(a.r));
    sorted.forEach((s,i)=>{
      const a=s.u===1||s.u===true?'▲':s.u===0||s.u===false?'▼':'-';
      const cls=s.u===1||s.u===true?'up':s.u===0||s.u===false?'down':'flat';
      const sg=s.u===1||s.u===true?'+':s.u===0||s.u===false?'-':'';
      let badges='';
      if(rateTop&&s.code===rateTop.code)badges+='<span class="badge badge-fire">🔥 등락1등</span>';
      if(tvTop&&s.code===tvTop.code)badges+='<span class="badge badge-crown">👑 대장주</span>';
      html+=`<tr data-code="${s.code}"><td><span class="sn">${s.name}${badges}</span><span class="sr">${s.role}</span></td><td class="price">${s.p.toLocaleString()}</td><td class="${cls}">${a} ${Math.abs(s.c).toLocaleString()}</td><td class="${cls}">${sg}${Math.abs(s.r).toFixed(2)}%</td><td class="tv">${formatTV(s.tv)}</td></tr>`;
    });
    html+=`</tbody></table><div class="updated-at" id="time-${t.id}">📋 초기 데이터 · 🔄 시세 불러오기 클릭</div></div>`;
  });
  document.getElementById('dashboard').innerHTML=html;
  renderSummary();
  document.querySelectorAll('.nav a').forEach(a=>{a.addEventListener('click',e=>{e.preventDefault();const t=document.querySelector(a.getAttribute('href'));if(t){const n=document.querySelector('.nav-wrap').offsetHeight;window.scrollTo({top:t.offsetTop-n-12,behavior:'smooth'});}});});
}

function rebuildTheme(theme){
  const {rateTop,tvTop}=getLeaders(theme);
  // Update leader bar
  let lb='';
  if(rateTop)lb+=`<div class="leader-chip fire">🔥 등락률 1등 <span class="lc-name">${rateTop.name}</span> <span class="lc-val ${rateTop.u===true?'up':'down'}">${rateTop.u===true?'+':'-'}${Math.abs(rateTop.r).toFixed(2)}%</span></div>`;
  if(tvTop)lb+=`<div class="leader-chip crown">👑 거래대금 <span class="lc-name">${tvTop.name}</span> <span class="lc-val">${formatTV(tvTop.tv)}</span></div>`;
  const lbEl=document.getElementById('lb-'+theme.id);
  if(lbEl)lbEl.innerHTML=lb;
  // Rebuild table sorted by rate
  const sorted=[...theme.stocks].sort((a,b)=>Math.abs(b.r)-Math.abs(a.r));
  let rows='';
  sorted.forEach(s=>{
    const a=s.u===true?'▲':s.u===false?'▼':'-';
    const cls=s.u===true?'up':s.u===false?'down':'flat';
    const sg=s.u===true?'+':s.u===false?'-':'';
    let badges='';
    if(rateTop&&s.code===rateTop.code)badges+='<span class="badge badge-fire">🔥 등락1등</span>';
    if(tvTop&&s.code===tvTop.code)badges+='<span class="badge badge-crown">👑 대장주</span>';
    rows+=`<tr data-code="${s.code}"><td><span class="sn">${s.name}${badges}</span><span class="sr">${s.role}</span></td><td class="price">${s.p.toLocaleString()}</td><td class="${cls}">${a} ${Math.abs(s.c).toLocaleString()}</td><td class="${cls}">${sg}${Math.abs(s.r).toFixed(2)}%</td><td class="tv">${formatTV(s.tv)}</td></tr>`;
  });
  const tb=document.getElementById('tb-'+theme.id);
  if(tb)tb.innerHTML=rows;
}

async function fetchAllPrices(){
  const btn=document.getElementById('refreshBtn');
  const badge=document.getElementById('statusBadge');
  const progArea=document.getElementById('progressArea');
  const progFill=document.getElementById('progressFill');
  const progText=document.getElementById('progressText');
  btn.disabled=true;btn.textContent='⏳ 불러오는 중...';
  badge.className='status loading';badge.textContent='⏳ 데이터 수신 중';
  progArea.style.display='block';document.getElementById('errorArea').innerHTML='';
  let done=0,ok=0,fail=0;
  for(const theme of THEMES){
    for(const stock of theme.stocks){
      try{
        const res=await fetch('/api/stock?code='+stock.code);
        const data=await res.json();
        if(data.success){
          stock.p=data.price;stock.c=data.change;stock.r=data.rate;stock.u=data.up;stock.tv=data.tradingValue||0;
          ok++;
        }else{fail++;}
      }catch(e){fail++;}
      done++;
      progFill.style.width=Math.round(done/totalStocks*100)+'%';
      progText.textContent=`${done}/${totalStocks} 종목 (성공:${ok} 실패:${fail})`;
      await new Promise(r=>setTimeout(r,55));
    }
    rebuildTheme(theme);
  }
  renderSummary();
  const now=new Date();
  const ts=now.toLocaleString('ko-KR',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  document.querySelectorAll('.updated-at').forEach(el=>{el.textContent=`✅ 실시간 업데이트 · ${ts}`;});
  if(fail>0&&ok===0){
    document.getElementById('errorArea').innerHTML='<div class="error-msg">❌ API 연결 실패 — Vercel 환경변수 확인 필요</div>';
    badge.className='status off';badge.textContent='❌ 연결 실패';
  }else{
    badge.className='status live';badge.textContent=`🟢 실시간 · ${ts}`;
    isLive=true;
  }
  btn.disabled=false;btn.textContent='🔄 시세 불러오기';
  setTimeout(()=>{progArea.style.display='none';},3000);
}

function setAutoRefresh(){
  if(refreshTimer)clearInterval(refreshTimer);
  const sec=parseInt(document.getElementById('refreshInterval').value);
  if(sec>0)refreshTimer=setInterval(fetchAllPrices,sec*1000);
}

renderDashboard();
setAutoRefresh();
</script>
