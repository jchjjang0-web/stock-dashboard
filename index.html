<meta charset="UTF-8">

<title>테마별 대장주 대시보드</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/pretendard/1.3.9/static/pretendard.min.css" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Pretendard',-apple-system,sans-serif;background:#0f1117;color:#e2e4e9;line-height:1.6}
.hd{background:linear-gradient(135deg,#131620,#1a1f2e);border-bottom:1px solid #2a2f3e;padding:16px 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
.hd h1{font-size:18px;font-weight:800;color:#fff}
.hd-r{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.st{font-size:11px;padding:4px 10px;border-radius:14px;font-weight:600}
.st.on{background:#22c55e20;color:#4ade80}.st.off{background:#ef444420;color:#f87171}.st.ld{background:#f59e0b20;color:#fbbf24}
.bt{padding:7px 14px;border-radius:8px;border:1px solid #2a2f3e;background:#1a1f2e;color:#e2e4e9;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .15s}
.bt:hover{background:#252b3d}.bt.pr{background:#3b82f6;border-color:#3b82f6;color:#fff}.bt:disabled{opacity:.4;cursor:not-allowed}

/* Search */
.search-wrap{max-width:960px;margin:12px auto;padding:0 16px}
.search-box{display:flex;align-items:center;background:#161a26;border:1px solid #1e2333;border-radius:10px;padding:8px 14px;gap:8px}
.search-box input{flex:1;background:none;border:none;color:#e2e4e9;font-size:14px;font-family:inherit;outline:none}
.search-box input::placeholder{color:#4b5563}
.search-results{background:#161a26;border:1px solid #2a2f3e;border-radius:10px;margin-top:6px;max-height:300px;overflow-y:auto;display:none}
.search-results.show{display:block}
.sr-item{padding:10px 14px;border-bottom:1px solid #1e2333;cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-size:13px}
.sr-item:hover{background:#1a1f2e}
.sr-item .sri-name{font-weight:700}.sr-item .sri-theme{font-size:11px;color:#6b7280}

/* Progress */
.pg{max-width:960px;margin:0 auto;padding:0 16px;display:none}
.pg-track{height:3px;background:#1e2333;border-radius:2px;overflow:hidden}
.pg-fill{height:100%;background:linear-gradient(90deg,#3b82f6,#22c55e);border-radius:2px;transition:width .3s;width:0%}
.pg-txt{font-size:10px;color:#6b7280;text-align:center;padding:4px 0}

.ct{max-width:960px;margin:0 auto;padding:12px 16px 80px}
.sec-t{font-size:15px;font-weight:800;color:#fff;margin:16px 0 10px;padding-left:2px}

/* Main View - Theme Cards */
.theme-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.tc{background:#161a26;border:1px solid #1e2333;border-radius:12px;padding:14px;cursor:pointer;transition:all .2s;position:relative;overflow:hidden}
.tc:hover{border-color:#3b82f6;transform:translateY(-2px);box-shadow:0 4px 12px #0004}
.tc-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.tc-name{font-size:14px;font-weight:800;color:#fff}
.tc-str{font-size:12px;font-weight:700;padding:3px 8px;border-radius:6px}
.tc-str.hot{background:#ef444420;color:#f87171}.tc-str.warm{background:#f59e0b20;color:#fbbf24}.tc-str.cool{background:#3b82f620;color:#60a5fa}.tc-str.cold{background:#6b728020;color:#9ca3af}
.tc-list{display:flex;flex-direction:column;gap:2px}
.tc-row{display:flex;align-items:center;gap:6px;font-size:12px}
.tc-rk{width:16px;height:16px;border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:800;flex-shrink:0}
.r1{background:#ef444430;color:#f87171}.r2{background:#f59e0b30;color:#fbbf24}.r3{background:#22c55e30;color:#4ade80}.r4{background:#3b82f630;color:#60a5fa}.r5{background:#6b728030;color:#9ca3af}
.tc-sn{font-weight:600;color:#d1d5db;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tc-sr{font-weight:700;font-size:12px}
.tc-crown{display:flex;align-items:center;gap:4px;font-size:11px;margin-top:6px;padding-top:6px;border-top:1px solid #1e2333;color:#fbbf24}
.tc-crown .tcn{color:#e2e4e9;font-weight:700}.tc-crown .tcv{color:#6b7280}
.tc-empty{color:#6b7280;font-size:12px;padding:4px 0}
.tc-arrow{position:absolute;right:14px;bottom:14px;color:#4b5563;font-size:14px}

/* Detail View */
#detailView{display:none}
.detail-back{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:8px;background:#1a1f2e;border:1px solid #2a2f3e;color:#e2e4e9;font-size:13px;font-weight:600;cursor:pointer;margin-bottom:12px;font-family:inherit;transition:all .15s}
.detail-back:hover{background:#252b3d}
.detail-header{background:#161a26;border:1px solid #1e2333;border-radius:14px;padding:18px;margin-bottom:12px}
.dh-top{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.dh-icon{font-size:24px}.dh-name{font-size:20px;font-weight:800;color:#fff}
.dh-str{font-size:14px;font-weight:700;padding:4px 10px;border-radius:8px}
.dh-chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.dchip{display:flex;align-items:center;gap:4px;padding:5px 10px;border-radius:6px;font-size:11px;font-weight:600}
.dchip .dr{width:16px;height:16px;border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:800}
.dchip .dn{color:#e2e4e9;font-weight:700}.dchip .dv{font-weight:700}
.dchip.crown{background:#f59e0b12;border:1px solid #f59e0b30;color:#fbbf24}

table{width:100%;border-collapse:collapse;font-size:13px;background:#161a26;border-radius:14px;overflow:hidden;border:1px solid #1e2333}
thead th{padding:8px 12px;font-weight:600;color:#6b7280;text-align:left;font-size:11px;background:#131620}
thead th:nth-child(2),thead th:nth-child(3),thead th:nth-child(4),thead th:nth-child(5){text-align:right}
tbody tr{border-top:1px solid #1a1e2a;transition:background .15s}
tbody tr:hover{background:#1a1f2e}
td{padding:8px 12px;vertical-align:top}
td:nth-child(2),td:nth-child(3),td:nth-child(4),td:nth-child(5){text-align:right;font-variant-numeric:tabular-nums}
.sn{font-weight:700;color:#e2e4e9}.sr{display:block;font-size:10px;color:#6b7280;margin-top:1px}
.price{font-weight:600;color:#d1d5db}.up{color:#ef4444}.down{color:#3b82f6}.flat{color:#6b7280}.tv{font-size:12px;color:#9ca3af}
.badge{display:inline-block;font-size:9px;font-weight:800;padding:2px 6px;border-radius:4px;margin-left:4px;vertical-align:middle}
.b1{background:#ef444425;color:#f87171}.b2{background:#f59e0b25;color:#fbbf24}.b3{background:#22c55e25;color:#4ade80}.b4{background:#3b82f625;color:#60a5fa}.b5{background:#6b728025;color:#9ca3af}
.bc{background:#f59e0b20;color:#fbbf24}
.updated-at{text-align:center;padding:10px;font-size:11px;color:#4b5563}
.error-msg{background:#ef444420;border:1px solid #ef444440;border-radius:10px;padding:14px;margin:12px 0;color:#f87171;font-size:13px;text-align:center}

@media(max-width:600px){.hd h1{font-size:16px}.theme-grid{grid-template-columns:1fr}table{font-size:11px}td,thead th{padding:6px 8px}.dh-name{font-size:18px}}
</style>

let rTimer=null,total=0,fetched=false;
function fTV(v){if(!v)return'-';if(v>=1e12)return(v/1e12).toFixed(1)+'조';if(v>=1e8)return(v/1e8).toFixed(0)+'억';return'-';}
function isU(s){return s.u===true;}
function top5(t){return t.s.filter(s=>isU(s)&&s.r>0).sort((a,b)=>b.r-a.r).slice(0,5);}
function tvTop(t){const sorted=[...t.s].sort((a,b)=>(b.tv||0)-(a.tv||0));return sorted[0]&&sorted[0].tv>0?sorted[0]:null;}
function themeStr(t){const ups=t.s.filter(s=>isU(s)&&s.r>0);if(!ups.length)return 0;return ups.reduce((a,b)=>a+b.r,0)/ups.length;}
function strCls(v){if(v>=5)return'hot';if(v>=2)return'warm';if(v>0)return'cool';return'cold';}

// SEARCH
function doSearch(q){
  const el=document.getElementById('searchResults');
  if(!q||q.length<1){el.classList.remove('show');return;}
  q=q.toLowerCase();
  let results=[];
  T.forEach(t=>{t.s.forEach(s=>{
    if(s.n.toLowerCase().includes(q)||s.c.includes(q)||s.ro.toLowerCase().includes(q)){
      results.push({...s,theme:t.n,themeId:t.id,themeIdx:T.indexOf(t)});
    }
  });});
  const seen=new Set();results=results.filter(r=>{if(seen.has(r.c+r.themeId))return false;seen.add(r.c+r.themeId);return true;});
  if(!results.length){el.innerHTML='<div class="sr-item"><span style="color:#6b7280">검색 결과 없음</span></div>';el.classList.add('show');return;}
  let h='';results.slice(0,10).forEach(r=>{
    const cls=isU(r)?'up':r.u===false?'down':'flat';
    const sg=isU(r)?'+':r.u===false?'-':'';
    h+=`<div class="sr-item" onclick="showDetail(${r.themeIdx});clearSearch()"><div><span class="sri-name">${r.n}</span> <span class="sri-theme">${r.theme} · ${r.c}</span></div><span class="${cls}">${r.p?r.p.toLocaleString():'-'} ${r.r?sg+Math.abs(r.r).toFixed(2)+'%':''}</span></div>`;
  });
  el.innerHTML=h;el.classList.add('show');
}
function clearSearch(){document.getElementById('searchInput').value='';document.getElementById('searchResults').classList.remove('show');}

function showMain(){document.getElementById('mainView').style.display='block';document.getElementById('detailView').style.display='none';window.scrollTo(0,0);}
function showDetail(idx){
  const t=T[idx];
  document.getElementById('mainView').style.display='none';
  document.getElementById('detailView').style.display='block';
  const t5=top5(t),tv=tvTop(t),t5c=t5.map(s=>s.c),tvc=tv?tv.c:null;
  const str=themeStr(t);
  let h=`<div class="detail-header"><div class="dh-top"><span class="dh-icon">${t.ic}</span><span class="dh-name">${t.n}</span><span class="dh-str ${strCls(str)}">${str>0?'+':''}${str.toFixed(2)}%</span></div>`;
  h+=`<div class="dh-chips">`;
  t5.forEach((s,i)=>{h+=`<div class="dchip"><div class="dr ${RC[i]}">${i+1}</div><span class="dn">${s.n}</span><span class="dv up">+${s.r.toFixed(2)}%</span></div>`;});
  if(tv)h+=`<div class="dchip crown">👑 <span class="dn">${tv.n}</span><span class="dv">${fTV(tv.tv)}</span></div>`;
  h+=`</div></div>`;
  const sorted=[...t.s].sort((a,b)=>{if(isU(a)&&!isU(b))return-1;if(!isU(a)&&isU(b))return 1;if(isU(a)&&isU(b))return b.r-a.r;return a.r-b.r;});
  h+=`<table><thead><tr><th>종목명</th><th>현재가</th><th>전일비</th><th>등락률</th><th>거래대금</th></tr></thead><tbody>`;
  sorted.forEach(s=>{
    const ar=isU(s)?'▲':s.u===false?'▼':'-';const cl=isU(s)?'up':s.u===false?'down':'flat';const sg=isU(s)?'+':s.u===false?'-':'';
    let bd='';const ri=t5c.indexOf(s.c);
    if(ri>=0)bd+=`<span class="badge ${BC[ri]}">${RE[ri]} ${RL[ri]}</span>`;
    if(tvc&&s.c===tvc)bd+=`<span class="badge bc">👑 대장주</span>`;
    h+=`<tr><td><span class="sn">${s.n}${bd}</span><span class="sr">${s.ro}</span></td><td class="price">${s.p?s.p.toLocaleString():'-'}</td><td class="${cl}">${s.p?ar+' '+Math.abs(s.ch).toLocaleString():'-'}</td><td class="${cl}">${s.p?sg+Math.abs(s.r).toFixed(2)+'%':'-'}</td><td class="tv">${fTV(s.tv)}</td></tr>`;
  });
  h+=`</tbody></table>`;
  if(!fetched)h+=`<div class="updated-at">🔄 시세 불러오기를 눌러 실시간 데이터를 가져오세요</div>`;
  document.getElementById('detailContent').innerHTML=h;
  window.scrollTo(0,0);
}

function renderMain(){
  const sorted=[...T.map((t,i)=>({t,i,str:themeStr(t)}))].sort((a,b)=>b.str-a.str);
  let h='';
  sorted.forEach(({t,i,str})=>{
    const t5=top5(t),tv=tvTop(t);
    h+=`<div class="tc" onclick="showDetail(${i})"><div class="tc-head"><span class="tc-name">${t.ic} ${t.n}</span><span class="tc-str ${strCls(str)}">${str>0?'+':''}${str.toFixed(2)}%</span></div><div class="tc-list">`;
    if(t5.length){t5.forEach((s,j)=>{h+=`<div class="tc-row"><div class="tc-rk ${RC[j]}">${j+1}</div><span class="tc-sn">${s.n}</span><span class="tc-sr up">+${s.r.toFixed(2)}%</span></div>`;});}
    else{h+=`<div class="tc-empty">상승 종목 없음 (시세 불러오기 필요)</div>`;}
    if(tv)h+=`<div class="tc-crown">👑 거래대금 <span class="tcn">${tv.n}</span> <span class="tcv">${fTV(tv.tv)}</span></div>`;
    h+=`</div><span class="tc-arrow">→</span></div>`;
  });
  document.getElementById('tGrid').innerHTML=h;
}

async function fetchAll(){
  const btn=document.getElementById('rfB'),bg=document.getElementById('stB');
  const pa=document.getElementById('pgA'),pf=document.getElementById('pgF'),pt=document.getElementById('pgT');
  const allCodes=new Set();T.forEach(t=>t.s.forEach(s=>allCodes.add(s.c)));
  const codeMap={};
  btn.disabled=true;btn.textContent='⏳ 불러오는 중...';bg.className='st ld';bg.textContent='⏳ 수신중';pa.style.display='block';
  let d=0,ok=0;const totalC=allCodes.size;
  for(const code of allCodes){
    try{
      const res=await fetch('/api/stock?code='+code);const data=await res.json();
      if(data.success){codeMap[code]=data;ok++;}
    }catch(e){}
    d++;pf.style.width=Math.round(d/totalC*100)+'%';pt.textContent=`${d}/${totalC} 종목 (성공:${ok})`;
    await new Promise(r=>setTimeout(r,55));
  }
  T.forEach(t=>{t.s.forEach(s=>{
    const d=codeMap[s.c];
    if(d){s.p=d.price;s.ch=d.change;s.r=d.rate;s.u=d.up;s.tv=d.tradingValue||0;}
  });});
  fetched=true;
  renderMain();
  const ts=new Date().toLocaleString('ko-KR',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  if(ok===0){document.getElementById('errA').innerHTML='<div class="error-msg">❌ API 연결 실패</div>';bg.className='st off';bg.textContent='❌ 실패';}
  else{bg.className='st on';bg.textContent=`🟢 실시간 · ${ts}`;}
  btn.disabled=false;btn.textContent='🔄 시세 불러오기';setTimeout(()=>{pa.style.display='none';},2000);
}

T.forEach(t=>total+=t.s.length);
renderMain();
</script>
