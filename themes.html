<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>종목 관리</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Pretendard',-apple-system,'Segoe UI',sans-serif;background:#f6f5f2;color:#1c1c1e;min-height:100vh;-webkit-font-smoothing:antialiased}
.header{background:#ffffff;border-bottom:1px solid #e9e7e1;position:sticky;top:0;z-index:100}
.header-inner{max-width:800px;margin:0 auto;padding:14px 22px;display:flex;align-items:center;justify-content:space-between}
.header h1{font-size:17px;font-weight:700;color:#1c1c1e;letter-spacing:-.01em}
.header-btns{display:flex;gap:8px;align-items:center}
.btn{padding:8px 14px;border-radius:8px;border:none;font-size:13px;cursor:pointer;font-weight:600;transition:all .15s}
.btn-primary{background:#1c1c1e;color:#fff}
.btn-primary:hover{background:#000}
.btn-secondary{background:#f1efe9;color:#5c5c60}
.btn-secondary:hover{background:#e9e7e1;color:#1c1c1e}
.btn-danger{background:#fbeceb;color:#c73e3a}
.btn-danger:hover{background:#f6dcda}
.btn-success{background:#e2f2e6;color:#1f7a41}
.btn-success:hover{background:#d3ecd9}
.btn-small{padding:5px 10px;font-size:12px}
.container{max-width:800px;margin:0 auto;padding:20px 22px}
.section-title{font-size:15px;color:#5c5c60;margin:20px 0 10px;display:flex;align-items:center;justify-content:space-between;font-weight:600}
.theme-count{font-size:12px;color:#a3a198;font-weight:400}
/* 자동저장 상태 표시 */
.autosave-status{font-size:11px;padding:4px 10px;border-radius:8px;font-weight:600}
.autosave-status.idle{background:#f1efe9;color:#a3a198}
.autosave-status.pending{background:#fbe9cf;color:#8a5a12}
.autosave-status.saving{background:#fbe9cf;color:#8a5a12}
.autosave-status.done{background:#e2f2e6;color:#1f7a41}
.autosave-status.error{background:#fbeceb;color:#c73e3a}
/* 테마 카드 */
.theme-card{background:#ffffff;border-radius:14px;margin-bottom:12px;border:1px solid #d8d5cc;overflow:hidden}
.theme-header{padding:14px 16px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;transition:background .15s}
.theme-header:hover{background:#faf9f6}
.theme-name{font-size:16px;font-weight:700;color:#1c1c1e}
.theme-badge{font-size:12px;color:#a3a198;background:#f1efe9;padding:3px 10px;border-radius:12px}
.theme-actions{display:flex;gap:6px}
/* 종목 리스트 */
.stock-list{border-top:1px solid #f1efe9}
.stock-item{padding:12px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #f1efe9}
.stock-item:last-child{border-bottom:none}
.stock-item:hover{background:#faf9f6}
.stock-name{font-size:14px;font-weight:600;color:#1c1c1e}
.stock-code{font-size:11px;color:#a3a198;margin-left:6px}
.stock-desc{font-size:12px;color:#8a8a8f;margin-top:2px}
.stock-tags{display:flex;gap:4px;margin-top:4px;flex-wrap:wrap}
.tag{font-size:10px;background:#f1efe9;color:#6b6b6f;padding:2px 8px;border-radius:10px}
.stock-actions{display:flex;gap:4px}
/* 입력 폼 */
.modal-bg{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(28,28,30,.45);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:#ffffff;border-radius:16px;padding:24px;width:100%;max-width:500px;max-height:90vh;overflow-y:auto;border:1px solid #eeece6;box-shadow:0 20px 40px rgba(28,28,30,.18)}
.modal h2{font-size:18px;font-weight:700;margin-bottom:16px;color:#1c1c1e}
.field{margin-bottom:14px}
.field label{font-size:12px;color:#5c5c60;display:block;margin-bottom:4px}
.field input,.field textarea{width:100%;padding:10px 12px;border-radius:8px;border:1px solid #e9e7e1;background:#faf9f6;color:#1c1c1e;font-size:14px;outline:none}
.field input:focus,.field textarea:focus{border-color:#c8952e}
.field textarea{resize:vertical;min-height:60px}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modal-btns{display:flex;gap:8px;margin-top:16px}
.modal-btns .btn{flex:1}
/* 검색 */
.search-bar{position:relative;margin-bottom:16px}
.search-bar input{width:100%;padding:12px 16px 12px 40px;border-radius:12px;border:1px solid #e9e7e1;background:#ffffff;color:#1c1c1e;font-size:14px;outline:none}
.search-bar input:focus{border-color:#c8952e}
.search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#a3a198}
/* 빈 상태 */
.empty{text-align:center;padding:40px 20px;color:#a3a198}
.empty-icon{font-size:48px;margin-bottom:12px;opacity:.7}
.empty-text{font-size:14px;line-height:1.6}
/* 확인 모달 */
.confirm-modal{text-align:center}
.confirm-modal p{font-size:15px;margin-bottom:20px;color:#1c1c1e;line-height:1.5}
/* 토스트 */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1c1c1e;color:#fff;padding:11px 22px;border-radius:10px;font-size:14px;z-index:999;animation:fadeUp .3s;box-shadow:0 8px 24px rgba(28,28,30,.25)}
@keyframes fadeUp{from{opacity:0;transform:translateX(-50%) translateY(10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
/* 요약 바 */
.summary-bar{background:#ffffff;border-radius:14px;padding:14px 16px;margin-bottom:16px;display:flex;gap:20px;border:1px solid #d8d5cc}
.summary-item{text-align:center}
.summary-num{font-size:22px;font-weight:800;color:#c8952e}
.summary-label{font-size:11px;color:#a3a198;margin-top:2px}
</style>
</head>
<body>
<div class="header">
<div class="header-inner">
  <h1>📋 종목 관리</h1>
  <div class="header-btns">
    <span class="autosave-status idle" id="autosaveStatus">☁️ 대기중</span>
    <button class="btn btn-secondary" onclick="exportData()">💾 내보내기</button>
    <button class="btn btn-secondary" onclick="importData()">📥 데이터 가져오기</button>
    <button class="btn btn-primary" onclick="location.href='index.html'">📊 대시보드</button>
  </div>
</div>
</div>
<div class="container">
  <!-- 요약 -->
  <div class="summary-bar" id="summaryBar"></div>
  <!-- 검색 -->
  <div class="search-bar">
    <span class="search-icon">🔍</span>
    <input type="text" id="searchInput" placeholder="종목명, 종목코드, 태그로 검색" oninput="renderAll()">
  </div>
  <!-- 테마 추가 버튼 -->
  <div class="section-title">
    <span>테마 목록 <span class="theme-count" id="themeCount"></span></span>
    <button class="btn btn-primary btn-small" onclick="openAddTheme()">+ 테마 추가</button>
  </div>
  <!-- 테마 리스트 -->
  <div id="themeList"></div>
</div>
<!-- 토스트 -->
<div id="toast" class="toast" style="display:none"></div>
<!-- 모달 영역 -->
<div id="modalArea"></div>
<script>
// ─── 데이터 관리 (localStorage) ───
const STORAGE_KEY = 'stock-dashboard-data';
function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch(e) {}
  return { themes: [], version: 1 };
}
function saveData(data) {
  data.version = (data.version || 0) + 1;
  data.lastUpdated = new Date().toISOString();
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  scheduleAutoSave(data); // 종목/테마가 바뀔 때마다 GitHub data.json 자동 저장 예약
}

// ─── GitHub data.json 자동 저장 (마지막 수정 후 3초 뒤 한 번에 저장) ───
const AUTO_SAVE_DELAY = 3000;
let autoSaveTimer = null;

function setAutoSaveStatus(state, text) {
  const el = document.getElementById('autosaveStatus');
  if (!el) return;
  el.className = 'autosave-status ' + state;
  el.textContent = text;
}

function scheduleAutoSave(data) {
  clearTimeout(autoSaveTimer);
  setAutoSaveStatus('pending', '⏳ 저장 대기중...');
  autoSaveTimer = setTimeout(() => autoSaveToGithub(data), AUTO_SAVE_DELAY);
}

async function autoSaveToGithub(data) {
  setAutoSaveStatus('saving', '☁️ 저장 중...');
  try {
    const res = await fetch('/api/save-data', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ data })
    });
    const json = await res.json();
    if (json.success) {
      setAutoSaveStatus('done', '✅ 자동 저장됨');
    } else {
      setAutoSaveStatus('error', '❌ 저장 실패');
      console.error('자동 저장 실패:', json.error);
    }
  } catch (e) {
    setAutoSaveStatus('error', '❌ 저장 실패');
    console.error('자동 저장 실패:', e);
  }
}

// ─── 토스트 ───
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  setTimeout(() => t.style.display = 'none', 2000);
}
// ─── 테마 펼치기 상태 ───
let expandedThemes = {};
// ─── 렌더링 ───
function renderAll() {
  const data = loadData();
  const query = document.getElementById('searchInput').value.toLowerCase().trim();
  
  // 요약
  const totalThemes = data.themes.length;
  const totalStocks = data.themes.reduce((s, t) => s + t.stocks.length, 0);
  const withCode = data.themes.reduce((s, t) => s + t.stocks.filter(st => st.code).length, 0);
  document.getElementById('summaryBar').innerHTML = `
    <div class="summary-item"><div class="summary-num">${totalThemes}</div><div class="summary-label">테마</div></div>
    <div class="summary-item"><div class="summary-num">${totalStocks}</div><div class="summary-label">종목</div></div>
    <div class="summary-item"><div class="summary-num">${withCode}</div><div class="summary-label">코드 입력됨</div></div>
  `;
  document.getElementById('themeCount').textContent = `(${totalThemes}개)`;
  // 테마 리스트
  let html = '';
  if (data.themes.length === 0) {
    html = `<div class="empty">
      <div class="empty-icon">📁</div>
      <div class="empty-text">아직 테마가 없어요<br>"+ 테마 추가" 버튼을 눌러 시작하세요!</div>
    </div>`;
  } else {
    data.themes.forEach((theme, ti) => {
      // 검색 필터
      let filteredStocks = theme.stocks;
      if (query) {
        filteredStocks = theme.stocks.filter(s =>
          s.name.toLowerCase().includes(query) ||
          (s.code && s.code.includes(query)) ||
          (s.tags && s.tags.some(t => t.toLowerCase().includes(query))) ||
          (s.desc && s.desc.toLowerCase().includes(query))
        );
        if (filteredStocks.length === 0 && !theme.name.toLowerCase().includes(query)) return;
      }
      const isOpen = expandedThemes[theme.name] || query;
      html += `<div class="theme-card">
        <div class="theme-header" onclick="toggleTheme('${theme.name}')">
          <div>
            <span class="theme-name">${theme.name}</span>
            <span class="theme-badge">${theme.stocks.length}종목</span>
          </div>
          <div class="theme-actions">
            <button class="btn btn-primary btn-small" onclick="event.stopPropagation();openAddStock(${ti})">+ 종목</button>
            <button class="btn btn-danger btn-small" onclick="event.stopPropagation();confirmDeleteTheme(${ti})">삭제</button>
          </div>
        </div>`;
      
      if (isOpen) {
        html += `<div class="stock-list">`;
        if (filteredStocks.length === 0) {
          html += `<div class="stock-item"><span style="color:#a3a198;font-size:13px">종목이 없습니다. "+ 종목" 버튼으로 추가하세요.</span></div>`;
        } else {
          filteredStocks.forEach((s, si) => {
            const realIdx = theme.stocks.indexOf(s);
            html += `<div class="stock-item">
              <div>
                <span class="stock-name">${s.name}</span>
                ${s.code ? `<span class="stock-code">${s.code}</span>` : ''}
                ${s.desc ? `<div class="stock-desc">${s.desc}</div>` : ''}
                ${s.tags && s.tags.length ? `<div class="stock-tags">${s.tags.map(t => `<span class="tag">#${t}</span>`).join('')}</div>` : ''}
              </div>
              <div class="stock-actions">
                <button class="btn btn-secondary btn-small" onclick="openEditStock(${ti},${realIdx})">수정</button>
                <button class="btn btn-danger btn-small" onclick="confirmDeleteStock(${ti},${realIdx})">삭제</button>
              </div>
            </div>`;
          });
        }
        html += `</div>`;
      }
      html += `</div>`;
    });
  }
  document.getElementById('themeList').innerHTML = html;
}
function toggleTheme(name) {
  expandedThemes[name] = !expandedThemes[name];
  renderAll();
}
// ─── 모달 유틸 ───
function showModal(html) {
  document.getElementById('modalArea').innerHTML = `<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal">${html}</div></div>`;
}
function closeModal() {
  document.getElementById('modalArea').innerHTML = '';
}
// ─── 테마 추가 ───
function openAddTheme() {
  showModal(`
    <h2>새 테마 추가</h2>
    <div class="field">
      <label>테마명</label>
      <input type="text" id="newThemeName" placeholder="예: 반도체, AI, 2차전지" onkeydown="if(event.key==='Enter')addTheme()">
    </div>
    <div class="modal-btns">
      <button class="btn btn-secondary" onclick="closeModal()">취소</button>
      <button class="btn btn-primary" onclick="addTheme()">추가</button>
    </div>
  `);
  setTimeout(() => document.getElementById('newThemeName').focus(), 100);
}
function addTheme() {
  const name = document.getElementById('newThemeName').value.trim();
  if (!name) return;
  const data = loadData();
  if (data.themes.find(t => t.name === name)) {
    showToast('이미 있는 테마입니다');
    return;
  }
  data.themes.push({ name, stocks: [] });
  saveData(data);
  expandedThemes[name] = true;
  closeModal();
  renderAll();
  showToast(`"${name}" 테마 추가됨`);
}
// ─── 테마 삭제 ───
function confirmDeleteTheme(ti) {
  const data = loadData();
  const theme = data.themes[ti];
  showModal(`
    <div class="confirm-modal">
      <h2>테마 삭제</h2>
      <p>"${theme.name}" 테마와<br>포함된 ${theme.stocks.length}개 종목을<br>모두 삭제할까요?</p>
      <div class="modal-btns">
        <button class="btn btn-secondary" onclick="closeModal()">취소</button>
        <button class="btn btn-danger" onclick="deleteTheme(${ti})">삭제</button>
      </div>
    </div>
  `);
}
function deleteTheme(ti) {
  const data = loadData();
  const name = data.themes[ti].name;
  data.themes.splice(ti, 1);
  saveData(data);
  closeModal();
  renderAll();
  showToast(`"${name}" 테마 삭제됨`);
}
// ─── 종목 추가 ───
function openAddStock(ti) {
  const data = loadData();
  const theme = data.themes[ti];
  showModal(`
    <h2>종목 추가 <span style="color:#8a5a12;font-size:14px">#${theme.name}</span></h2>
    <div class="field">
      <label>종목명 *</label>
      <input type="text" id="sName" placeholder="삼성전자">
    </div>
    <div class="field-row">
      <div class="field">
        <label>종목코드 (6자리 숫자)</label>
        <input type="text" id="sCode" placeholder="005930" maxlength="6">
      </div>
      <div class="field">
        <label>시총(억)</label>
        <input type="text" id="sCap" placeholder="95178">
      </div>
    </div>
    <div class="field">
      <label>기업 설명</label>
      <input type="text" id="sDesc" placeholder="어떤 기업인지 간단하게">
    </div>
    <div class="field">
      <label>태그 (쉼표로 구분 — 다른 테마와 겹치는 키워드)</label>
      <input type="text" id="sTags" placeholder="HBM, AI, 스마트폰, OLED">
    </div>
    <div class="field">
      <label>메모 (선택)</label>
      <textarea id="sNews" placeholder="상한가 사유, 뉴스 요약 등"></textarea>
    </div>
    <div class="modal-btns">
      <button class="btn btn-secondary" onclick="closeModal()">취소</button>
      <button class="btn btn-success" onclick="saveStock(${ti},null,true)">추가하고 계속</button>
      <button class="btn btn-primary" onclick="saveStock(${ti},null,false)">추가</button>
    </div>
  `);
  setTimeout(() => document.getElementById('sName').focus(), 100);
}
// ─── 종목 수정 ───
function openEditStock(ti, si) {
  const data = loadData();
  const s = data.themes[ti].stocks[si];
  showModal(`
    <h2>종목 수정 <span style="color:#8a5a12;font-size:14px">#${data.themes[ti].name}</span></h2>
    <div class="field">
      <label>종목명 *</label>
      <input type="text" id="sName" value="${s.name}">
    </div>
    <div class="field-row">
      <div class="field">
        <label>종목코드 (6자리 숫자)</label>
        <input type="text" id="sCode" value="${s.code || ''}" maxlength="6">
      </div>
      <div class="field">
        <label>시총(억)</label>
        <input type="text" id="sCap" value="${s.marketCap || ''}">
      </div>
    </div>
    <div class="field">
      <label>기업 설명</label>
      <input type="text" id="sDesc" value="${s.desc || ''}">
    </div>
    <div class="field">
      <label>태그 (쉼표로 구분)</label>
      <input type="text" id="sTags" value="${(s.tags || []).join(', ')}">
    </div>
    <div class="field">
      <label>메모</label>
      <textarea id="sNews">${s.news || ''}</textarea>
    </div>
    <div class="modal-btns">
      <button class="btn btn-secondary" onclick="closeModal()">취소</button>
      <button class="btn btn-primary" onclick="saveStock(${ti},${si},false)">수정 완료</button>
    </div>
  `);
}
function saveStock(ti, si, keepOpen) {
  const name = document.getElementById('sName').value.trim();
  if (!name) { showToast('종목명을 입력해주세요'); return; }
  
  const stock = {
    name,
    code: document.getElementById('sCode').value.trim(),
    marketCap: document.getElementById('sCap').value.trim(),
    desc: document.getElementById('sDesc').value.trim(),
    tags: document.getElementById('sTags').value.split(/[,，]+/).map(t => t.trim()).filter(Boolean),
    news: document.getElementById('sNews').value.trim()
  };
  const data = loadData();
  if (si !== null && si !== undefined) {
    // 수정: 현재 테마 업데이트
    const oldStock = data.themes[ti].stocks[si];
    const oldName = oldStock.name;
    const oldCode = oldStock.code;
    data.themes[ti].stocks[si] = { ...oldStock, ...stock };
    // 동일 종목(이름 또는 코드 일치)이 다른 테마에도 있으면 같이 수정
    let syncCount = 0;
    data.themes.forEach((theme, tIdx) => {
      if (tIdx === ti) return; // 이미 수정한 현재 테마는 건너뛰기
      theme.stocks.forEach((s, sIdx) => {
        const matchByName = oldName && s.name === oldName;
        const matchByCode = oldCode && s.code === oldCode;
        if (matchByName || matchByCode) {
          data.themes[tIdx].stocks[sIdx] = { ...s, name: stock.name, code: stock.code, desc: stock.desc };
          syncCount++;
        }
      });
    });
    saveData(data);
    closeModal();
    renderAll();
    if (syncCount > 0) {
      showToast(`"${name}" 수정됨 (다른 테마 ${syncCount}곳도 동기화)`);
    } else {
      showToast(`"${name}" 수정됨`);
    }
  } else {
    // 추가
    data.themes[ti].stocks.push(stock);
    saveData(data);
    expandedThemes[data.themes[ti].name] = true;
    if (keepOpen) {
      // 폼 초기화하고 계속
      document.getElementById('sName').value = '';
      document.getElementById('sCode').value = '';
      document.getElementById('sCap').value = '';
      document.getElementById('sDesc').value = '';
      document.getElementById('sTags').value = '';
      document.getElementById('sNews').value = '';
      document.getElementById('sName').focus();
      renderAll();
      showToast(`"${name}" 추가됨 — 계속 입력하세요`);
    } else {
      closeModal();
      renderAll();
      showToast(`"${name}" 추가됨`);
    }
  }
}
// ─── 종목 삭제 ───
function confirmDeleteStock(ti, si) {
  const data = loadData();
  const s = data.themes[ti].stocks[si];
  showModal(`
    <div class="confirm-modal">
      <h2>종목 삭제</h2>
      <p>"${s.name}"을(를) 삭제할까요?</p>
      <div class="modal-btns">
        <button class="btn btn-secondary" onclick="closeModal()">취소</button>
        <button class="btn btn-danger" onclick="deleteStock(${ti},${si})">삭제</button>
      </div>
    </div>
  `);
}
function deleteStock(ti, si) {
  const data = loadData();
  const name = data.themes[ti].stocks[si].name;
  data.themes[ti].stocks.splice(si, 1);
  saveData(data);
  closeModal();
  renderAll();
  showToast(`"${name}" 삭제됨`);
}
// ─── 데이터 내보내기 (PC의 최신 데이터를 파일로 다운로드) ───
function exportData() {
  const raw = localStorage.getItem(STORAGE_KEY);
  if (!raw) { showToast('❌ 저장된 데이터가 없습니다'); return; }
  const blob = new Blob([raw], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'data.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('💾 data.json 다운로드 완료! (자동저장도 켜져있으니 참고용으로만 쓰셔도 돼요)');
}
// ─── 데이터 가져오기 (서버에서 최신 데이터 자동 로드) ───
async function importData() {
  try {
    showToast('📥 데이터 가져오는 중...');
    const res = await fetch('/data.json?' + Date.now());
    if (!res.ok) throw new Error('파일을 찾을 수 없습니다');
    const data = await res.json();
    data.lastUpdated = new Date().toISOString();
    localStorage.setItem('stock-dashboard-data', JSON.stringify(data));
    showToast('✅ 테마 ' + data.themes.length + '개 데이터 가져오기 완료!');
    setTimeout(() => { location.reload(); }, 1500);
  } catch (e) {
    showToast('❌ 데이터 가져오기 실패: ' + e.message);
  }
}
// ─── 초기 렌더 ───
renderAll();
</script>
